apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matinee.fullname" . }}
  labels:
    {{- include "matinee.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # See strategy in values.yaml.
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "matinee.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "matinee.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- if .Values.remoteAccess.enabled }}
      # Remote access talks to the home router, which only the node's own
      # network reaches.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- $gpu := .Values.gpu }}
      {{- $podSecurity := deepCopy .Values.podSecurityContext }}
      {{- $security := deepCopy .Values.securityContext }}
      {{- $resources := deepCopy .Values.resources }}
      {{- $limits := $resources.limits | default dict }}
      {{- if eq $gpu.type "vaapi" }}
      {{- with $gpu.vaapi.groups }}
      {{- $_ := set $podSecurity "supplementalGroups" (concat ($podSecurity.supplementalGroups | default list) .) }}
      {{- end }}
      {{- if $gpu.vaapi.resource }}
      {{- $_ := set $limits $gpu.vaapi.resource 1 }}
      {{- else }}
      {{- /* Without a device plugin, only a privileged container may open the node's GPU. */}}
      {{- $_ := set $security "privileged" true }}
      {{- $_ := unset $security "allowPrivilegeEscalation" }}
      {{- end }}
      {{- else if eq $gpu.type "nvidia" }}
      {{- $_ := set $limits "nvidia.com/gpu" $gpu.nvidia.count }}
      {{- with $gpu.nvidia.runtimeClassName }}
      runtimeClassName: {{ . }}
      {{- end }}
      {{- else if ne $gpu.type "none" }}
      {{- fail "gpu.type must be none, vaapi or nvidia" }}
      {{- end }}
      {{- if $limits }}
      {{- $_ := set $resources "limits" $limits }}
      {{- end }}
      securityContext:
        {{- toYaml $podSecurity | nindent 8 }}
      # Room for the drain delay and requests in flight (see shutdown in values.yaml).
      terminationGracePeriodSeconds: {{ add (include "matinee.drainDelay" . | atoi) .Values.shutdown.timeoutSeconds 10 }}
      containers:
        - name: matinee
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $security | nindent 12 }}
          ports:
            - name: http
              containerPort: 7171
            {{- if .Values.discovery.homePort }}
            # The home network's own way in, on the node's address, so the
            # server sees each device's real address (an ingress hides it).
            - name: home
              {{- if .Values.remoteAccess.enabled }}
              containerPort: {{ .Values.discovery.homePort }}
              {{- else }}
              containerPort: 7172
              {{- end }}
              hostPort: {{ .Values.discovery.homePort }}
            {{- end }}
            {{- if .Values.remoteAccess.enabled }}
            - name: remote
              containerPort: {{ .Values.remoteAccess.port }}
            {{- end }}
          env:
            - name: MATINEE_ADDR
              value: ":7171"
            - name: MATINEE_DRAIN_DELAY
              value: "{{ include "matinee.drainDelay" . }}s"
            - name: MATINEE_SHUTDOWN_TIMEOUT
              value: "{{ .Values.shutdown.timeoutSeconds }}s"
            - name: MATINEE_DATA_DIR
              value: /cache
            - name: MATINEE_MEDIA_ROOT
              value: {{ .Values.mediaRoot | quote }}
            # The pod network doesn't reach the home network; discovery.yaml announces it instead.
            - name: MATINEE_DISCOVERY
              value: "false"
            {{- if .Values.remoteAccess.enabled }}
            - name: MATINEE_REMOTE_ADDR
              value: ":{{ .Values.remoteAccess.port }}"
            {{- else }}
            # Remote access asks the home router for a port, which a pod
            # can't do off the host network; the ingress is the way in.
            - name: MATINEE_REMOTE_ADDR
              value: "off"
            {{- end }}
            {{- if .Values.discovery.homePort }}
            - name: MATINEE_HOME_ADDR
              {{- if .Values.remoteAccess.enabled }}
              value: ":{{ .Values.discovery.homePort }}"
              {{- else }}
              value: ":7172"
              {{- end }}
            {{- end }}
            - name: MATINEE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "matinee.databaseSecret" . }}
                  key: database-url
            {{- if or .Values.tmdb.apiKey .Values.tmdb.existingSecret }}
            - name: MATINEE_TMDB_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tmdb.existingSecret | default (printf "%s-tmdb" (include "matinee.fullname" .)) }}
                  key: tmdb-api-key
            {{- end }}
            {{- if and (eq .Values.gpu.type "vaapi") .Values.gpu.vaapi.device }}
            - name: MATINEE_VAAPI_DEVICE
              value: {{ .Values.gpu.vaapi.device | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
            failureThreshold: 60
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /cache
            {{- if .Values.downloads.persistence.enabled }}
            - name: downloads
              mountPath: /cache/downloads
            {{- end }}
            {{- if .Values.plugins.persistence.enabled }}
            - name: plugins
              mountPath: /cache/plugins
            {{- end }}
            {{- if .Values.thumbnails.persistence.enabled }}
            - name: thumbnails
              mountPath: /cache/thumbnails
            {{- end }}
            - name: tmp
              mountPath: /tmp
            {{- if .Values.remoteAccess.enabled }}
            - name: remote
              mountPath: /cache/remote
            {{- end }}
            {{- range .Values.media }}
            - name: media-{{ .name }}
              mountPath: {{ .mountPath }}
              {{- with .subPath }}
              subPath: {{ . | quote }}
              {{- end }}
              readOnly: true
            {{- end }}
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: {{ .Values.cache.sizeLimit }}
            {{- with .Values.cache.medium }}
            medium: {{ . }}
            {{- end }}
        - name: tmp
          emptyDir: {}
        {{- if .Values.downloads.persistence.enabled }}
        - name: downloads
          persistentVolumeClaim:
            claimName: {{ .Values.downloads.persistence.existingClaim | default (printf "%s-downloads" (include "matinee.fullname" .)) }}
        {{- end }}
        {{- if .Values.plugins.persistence.enabled }}
        - name: plugins
          persistentVolumeClaim:
            claimName: {{ .Values.plugins.persistence.existingClaim | default (printf "%s-plugins" (include "matinee.fullname" .)) }}
        {{- end }}
        {{- if .Values.thumbnails.persistence.enabled }}
        - name: thumbnails
          persistentVolumeClaim:
            claimName: {{ .Values.thumbnails.persistence.existingClaim | default (printf "%s-thumbnails" (include "matinee.fullname" .)) }}
        {{- end }}
        {{- if .Values.remoteAccess.enabled }}
        - name: remote
          persistentVolumeClaim:
            claimName: {{ .Values.remoteAccess.persistence.existingClaim | default (printf "%s-remote" (include "matinee.fullname" .)) }}
        {{- end }}
        {{- range .Values.media }}
        - name: media-{{ .name }}
          {{- toYaml .volume | nindent 10 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
