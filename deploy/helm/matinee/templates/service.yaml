apiVersion: v1
kind: Service
metadata:
  name: {{ include "matinee.fullname" . }}
  labels:
    {{- include "matinee.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  selector:
    {{- include "matinee.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
