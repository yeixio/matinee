{{- $url := include "matinee.publicURL" . }}
{{- if and .Values.discovery.enabled $url }}
# Announces the server on the home network so the apps list it. Runs on the
# host network, since multicast DNS doesn't cross the pod network; it only
# answers lookups and doesn't serve anything. With a home port it runs on
# the server's node and points the apps there.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matinee.fullname" . }}-discovery
  labels:
    {{- include "matinee.labels" . | nindent 4 }}
    app.kubernetes.io/component: discovery
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: discovery
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: announce
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - announce
            - -url
            - {{ $url | quote }}
            - -name
            - {{ .Values.discovery.name | quote }}
            {{- if .Values.discovery.homePort }}
            - -home-port
            - {{ .Values.discovery.homePort | quote }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml (.Values.discovery.resources | default (dict "requests" (dict "cpu" "5m" "memory" "16Mi") "limits" (dict "memory" "64Mi"))) | nindent 12 }}
      {{- if .Values.discovery.homePort }}
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "matinee.selectorLabels" . | nindent 18 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
