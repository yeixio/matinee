{{- if .Values.metrics.serviceMonitor.enabled }}
{{- if not .Values.metrics.tokenSecret.name }}
{{- fail "metrics.serviceMonitor needs metrics.tokenSecret.name: a Secret with the metrics token from Settings → Server health → Alerts" }}
{{- end }}
# Prometheus Operator scrapes /metrics with the metrics token.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "matinee.fullname" . }}
  labels:
    {{- include "matinee.labels" . | nindent 4 }}
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "matinee.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
      authorization:
        type: Bearer
        credentials:
          name: {{ .Values.metrics.tokenSecret.name }}
          key: {{ .Values.metrics.tokenSecret.key }}
{{- end }}
