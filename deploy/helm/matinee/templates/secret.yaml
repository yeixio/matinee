{{- if not (or .Values.database.existingSecret (include "matinee.generateDBSecret" .)) }}
{{- if and (not .Values.postgresql.enabled) (not .Values.database.url) }}
{{- fail "Set database.url or database.existingSecret, or enable the bundled postgresql." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matinee.databaseSecret" . }}
  labels:
    {{- include "matinee.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- $password := .Values.postgresql.auth.password }}
  postgres-password: {{ $password | quote }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgresql.auth.username $password (include "matinee.postgresql.fullname" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.tmdb.apiKey (not .Values.tmdb.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "matinee.fullname" . }}-tmdb
  labels:
    {{- include "matinee.labels" . | nindent 4 }}
type: Opaque
stringData:
  tmdb-api-key: {{ .Values.tmdb.apiKey | quote }}
{{- end }}
