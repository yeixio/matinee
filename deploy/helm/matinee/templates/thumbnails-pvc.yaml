{{- $p := .Values.thumbnails.persistence }}
{{- if and $p.enabled (not $p.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "matinee.fullname" . }}-thumbnails
  labels:
    {{- include "matinee.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with $p.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ include "matinee.pvcSize" (dict "ctx" $ "name" (printf "%s-thumbnails" (include "matinee.fullname" .)) "size" $p.size) }}
{{- end }}
