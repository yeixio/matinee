image:
  repository: ghcr.io/yeixio/matinee
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Keep 1 for now: active transcodes live in the pod that started them.
# Several replicas need sticky sessions (see service.sessionAffinity).
replicaCount: 1

service:
  type: ClusterIP
  port: 7171
  # ClientIP keeps a viewer on one pod when replicaCount > 1.
  sessionAffinity: None

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: matinee.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Optional themoviedb.org key for posters and descriptions.
tmdb:
  apiKey: ""
  # Or read it from an existing secret's "tmdb-api-key" key.
  existingSecret: ""

# Your media, mounted read-only. Any volume source works: nfs, persistentVolumeClaim, csi (SMB), hostPath...
# After install, add libraries in Settings: the folder picker opens at mediaRoot.
mediaRoot: /media
media: []
#  - name: movies
#    mountPath: /media/movies
#    volume:
#      nfs:
#        server: nas.local
#        path: /export/movies
#  - name: tv
#    mountPath: /media/tv
#    volume:
#      persistentVolumeClaim:
#        claimName: tv-library
#    subPath: "TV Shows"  # optional: mount one folder of the volume

# Transcode segments and the image cache. Rebuilt on demand, so emptyDir is fine.
# Use a fast local disk; network storage slows transcoding down.
cache:
  sizeLimit: 50Gi
  medium: ""  # "Memory" puts it in RAM (counts against the memory limit)

# Files converted for offline downloads. They take a while to make, so they
# go on a volume that survives restarts; set enabled: false to keep them in
# the cache above (they're remade after a restart if a device still needs one).
downloads:
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
    # Or use a claim you made yourself.
    existingClaim: ""

database:
  # Use an existing PostgreSQL instead of the bundled one (set postgresql.enabled=false):
  # either a full URL here...
  url: ""
  # ...or an existing secret holding it under the "database-url" key.
  # With the bundled PostgreSQL, the secret also needs "postgres-password", and database-url must use it:
  #   postgres://matinee:<password>@<release>-postgresql:5432/matinee?sslmode=disable
  existingSecret: ""

# Bundled PostgreSQL, so `helm install` works out of the box.
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "17-alpine"
  auth:
    username: matinee
    database: matinee
    # When empty, an install hook generates one into the <release>-db secret on first
    # install and keeps it from then on (works with Argo CD and Flux too). The secret
    # outlives `helm uninstall`, like the database volume, so a reinstall still matches.
    password: ""
  persistence:
    size: 8Gi
    storageClass: ""
  resources: {}

# Lets the apps find this server on your home network by themselves, so nobody
# has to type an address (they still can). A pod can't reach the home network,
# so a small announcer runs on a node's host network and points the apps at
# your server's address. Set enabled: false to keep the server unlisted.
discovery:
  enabled: true
  # The address the apps should connect to. Defaults to the first ingress host
  # above; set it when your ingress is managed outside this chart.
  url: ""
  # The name the apps show for this server.
  name: Matinee
  # A port on the server's node that serves the home network directly. Behind
  # an ingress the server can't tell home from the internet, so devices at
  # home use this port instead and can watch without signing in (an admin
  # can still require it in Settings). Don't forward it from your router.
  # 0 turns it off; then everyone signs in.
  homePort: 7172
  resources: {}

# Hardware transcoding. Matinee tests the GPUs it can see at startup and uses
# the best one that works (Settings → Transcoding shows which, and lets an
# admin pick another or turn it off). These values give the pod a GPU. To run
# Matinee on the node that has the GPU, set nodeSelector or affinity below,
# for example nodeSelector: {kubernetes.io/hostname: gpu-node}.
gpu:
  # none, vaapi (AMD or Intel GPUs, through /dev/dri) or nvidia.
  type: none
  vaapi:
    # A device plugin resource that hands the pod the GPU, such as
    # amd.com/gpu (AMD's plugin) or gpu.intel.com/i915 (Intel's).
    # Leave it empty when no plugin is installed: the container then runs
    # privileged, the only way Kubernetes lets it open the node's /dev/dri
    # without one.
    resource: ""
    # The groups allowed to open /dev/dri/renderD* on the node, so Matinee's
    # non-root user can (run `getent group render` on the node; the number is
    # often 104 to 110, or 989 to 993). If it's wrong, Settings → Transcoding
    # says which number it needs.
    groups: []
    # The render node to use when a node has several GPUs. Empty tries each.
    device: ""
  nvidia:
    # The RuntimeClass of NVIDIA's container runtime (the GPU Operator and
    # k3s both name it nvidia). Empty uses the node's default runtime.
    runtimeClassName: nvidia
    count: 1

env: []
#  - name: MATINEE_SCAN_INTERVAL
#    value: 30m
#  - name: MATINEE_WATCH_POLL_INTERVAL   # how often SMB/NFS folders are checked for new files
#    value: 30s

resources: {}
#  requests: {cpu: 500m, memory: 512Mi}
#  limits: {memory: 4Gi}

podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
