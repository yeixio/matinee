{{- if and (include "boxoffice.usesPostgres" .) (not (or .Values.database.existingSecret (include "boxoffice.generateDBSecret" .))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boxoffice.databaseSecret" . }}
  labels:
    {{- include "boxoffice.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  {{- $password := .Values.postgresql.auth.password }}
  postgres-password: {{ $password | quote }}
  database-url: {{ printf "postgres://%s:%s@%s:5432/%s?sslmode=disable" .Values.postgresql.auth.username $password (include "boxoffice.postgresql.fullname" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  database-url: {{ .Values.database.url | quote }}
  {{- end }}
---
{{- end }}
{{- if and .Values.apiKey.value (not .Values.apiKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boxoffice.apiKeySecret" . }}
  labels:
    {{- include "boxoffice.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.apiKey.value | quote }}
---
{{- end }}
{{- if and .Values.tmdb.apiKey (not .Values.tmdb.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "boxoffice.tmdbSecret" . }}
  labels:
    {{- include "boxoffice.labels" . | nindent 4 }}
type: Opaque
stringData:
  tmdb-api-key: {{ .Values.tmdb.apiKey | quote }}
{{- end }}
