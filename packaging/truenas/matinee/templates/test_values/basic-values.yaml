resources:
  limits:
    cpus: 2.0
    memory: 4096

matinee:
  server_name: Matinee
  additional_envs: []
network:
  host_network: false
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  data: /opt/tests/mnt/data
  media: /opt/tests/mnt/media

storage:
  data:
    type: ix_volume
    ix_volume_config:
      dataset_name: data
      create_host_path: true
  additional_storage:
    - type: ix_volume
      mount_path: /media
      read_only: true
      ix_volume_config:
        dataset_name: media
        create_host_path: true
