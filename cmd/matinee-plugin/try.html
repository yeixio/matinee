<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plugin preview</title>
<style>
  :root {
    --ink: #100d12; --surface: #18141b; --raised: #221d26; --line: #322b36;
    --text: #f4efea; --muted: #aca2ac; --accent: #ff6a55; --danger: #f08a80;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; }
  header .folder { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  button { font: inherit; color: var(--text); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  main { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
  .card { cursor: pointer; }
  .poster { aspect-ratio: 2 / 3; border-radius: 10px; background: var(--raised) center / cover no-repeat; border: 1px solid var(--line); display: flex; align-items: flex-end; padding: 10px; font-weight: 600; overflow: hidden; }
  .card:hover .poster { border-color: var(--accent); }
  .title { margin-top: 8px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .bad { color: var(--danger); font-size: 13px; margin-top: 4px; }
  .note { color: var(--muted); }
  #play { position: fixed; inset: 0; background: #000; display: none; flex-direction: column; }
  #play.open { display: flex; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: var(--surface); border-bottom: 1px solid var(--line); font-size: 13px; }
  #bar .what { flex: 1; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  iframe { flex: 1; width: 100%; border: 0; background: #000; }
  #log { max-height: 30vh; overflow: auto; margin: 0; padding: 8px 12px; background: var(--surface); border-top: 1px solid var(--line); font: 12px ui-monospace, monospace; color: var(--muted); display: none; }
  #log.open { display: block; }
  #log .err { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1 id="name">Plugin preview</h1>
  <div class="folder" id="folder"></div>
  <button id="rescan">Rescan</button>
</header>
<main>
  <p class="note" id="status">Scanning…</p>
  <div class="grid" id="grid"></div>
</main>
<div id="play">
  <div id="bar">
    <button id="back">← Back</button>
    <span class="what" id="what"></span>
    <button id="toggleLog">Requests</button>
  </div>
  <iframe id="frame" sandbox="allow-scripts allow-pointer-lock allow-downloads" allow="gamepad; fullscreen; autoplay"></iframe>
  <pre id="log"></pre>
</div>
<script type="module">
// This page stands in for Matinee's web player (web/src/plugins.ts): it
// shows the plugin's player in the same sandboxed frame and answers the
// same requests, from the folder being tried instead of a server.
const $ = (id) => document.getElementById(id)
let items = []
let playing = null

async function load() {
  $('status').textContent = 'Scanning…'
  $('grid').replaceChildren()
  const res = await fetch('/api/items')
  const body = await res.json()
  if (!res.ok) {
    $('status').textContent = body.error
    return
  }
  items = body.items ?? []
  $('name').textContent = body.plugin
  $('folder').textContent = body.folder
  $('status').textContent = items.length ? '' : 'The plugin filed nothing in this folder. Try matinee-plugin scan to see why.'
  for (const it of items) {
    const card = document.createElement('div')
    card.className = 'card'
    const poster = document.createElement('div')
    poster.className = 'poster'
    if (it.poster) poster.style.backgroundImage = `url("${it.poster}")`
    else poster.textContent = it.title ?? it.path
    const title = document.createElement('div')
    title.className = 'title'
    title.textContent = it.title ?? it.path
    const meta = document.createElement('div')
    meta.className = 'meta'
    meta.textContent = [it.kind, it.year, ...(it.parents ?? [])].filter(Boolean).join(' · ')
    card.append(poster, title, meta)
    for (const p of [it.error, ...(it.problems ?? [])].filter(Boolean)) {
      const bad = document.createElement('div')
      bad.className = 'bad'
      bad.textContent = p
      card.append(bad)
    }
    card.onclick = () => play(it)
    $('grid').append(card)
  }
}

function play(it) {
  if (it.error) return
  if (!it.player) {
    alert(`No player in plugin.json plays ${it.kind} items.`)
    return
  }
  playing = it
  $('log').replaceChildren()
  $('what').textContent = `${it.title} · ${it.path}`
  $('frame').src = it.player
  $('play').classList.add('open')
}

function stop() {
  playing = null
  $('frame').src = 'about:blank'
  $('play').classList.remove('open')
}

function note(text, error) {
  const line = document.createElement('div')
  if (error) line.className = 'err'
  line.textContent = text
  $('log').append(line)
  $('log').scrollTop = $('log').scrollHeight
  fetch('/api/log', { method: 'POST', body: text }).catch(() => {})
}

async function bytes(url, init) {
  const res = await fetch(url, init)
  if (!res.ok) {
    const err = new Error((await res.json().catch(() => ({}))).error ?? `status ${res.status}`)
    err.status = res.status
    throw err
  }
  return res.arrayBuffer()
}

const storageUrl = (key) => '/api/storage/' + key.split('/').map(encodeURIComponent).join('/')

async function answer(method, params = {}) {
  const str = (k) => {
    const v = params[k]
    if (typeof v !== 'string' || v === '') throw new Error(`${method} needs ${k}`)
    return v
  }
  switch (method) {
    case 'file': {
      const buf = await bytes(`/api/file/${playing.id}`)
      return [buf, [buf]]
    }
    case 'libraryFile': {
      const buf = await bytes(`/api/library-file?path=${encodeURIComponent(str('path'))}`)
      return [buf, [buf]]
    }
    case 'storage.list': {
      const prefix = typeof params.prefix === 'string' ? params.prefix : ''
      const res = await fetch(`/api/storage?prefix=${encodeURIComponent(prefix)}`)
      return [await res.json(), []]
    }
    case 'storage.get':
      try {
        const buf = await bytes(storageUrl(str('key')))
        return [buf, [buf]]
      } catch (e) {
        if (e.status === 404) return [null, []]
        throw e
      }
    case 'storage.put': {
      const v = params.value
      if (!(v instanceof ArrayBuffer) && typeof v !== 'string') throw new Error('storage.put needs a value')
      await bytes(storageUrl(str('key')), { method: 'PUT', body: v })
      return [null, []]
    }
    case 'storage.delete':
      await bytes(storageUrl(str('key')), { method: 'DELETE' })
      return [null, []]
    case 'progress':
      return [null, []]
    case 'exit':
      stop()
      return [null, []]
  }
  throw new Error(`unknown method ${method}`)
}

const describe = (params) => {
  if (!params) return ''
  const shown = Object.fromEntries(Object.entries(params).map(([k, v]) => [k, v instanceof ArrayBuffer ? `<${v.byteLength} bytes>` : v]))
  return JSON.stringify(shown)
}

addEventListener('message', async (e) => {
  const frame = $('frame')
  if (!playing || e.source !== frame.contentWindow) return
  const msg = e.data
  if (!msg || msg.matinee !== 1) return
  const send = (m, transfer = []) => frame.contentWindow.postMessage({ matinee: 1, ...m }, '*', transfer)
  if (msg.type === 'ready') {
    note('ready')
    const it = playing
    send({ type: 'start', language: navigator.language, item: {
      id: it.id, libraryId: it.libraryId, kind: it.kind, title: it.title, year: it.year, facts: it.facts ?? [], pluginData: it.pluginData ?? null,
    } })
    return
  }
  if (msg.type !== 'request') return
  const what = `${msg.method} ${describe(msg.params)}`
  try {
    const [result, transfer] = await answer(msg.method, msg.params ?? {})
    note(what + (result instanceof ArrayBuffer ? ` → ${result.byteLength} bytes` : ''))
    if (msg.method !== 'exit') send({ type: 'response', id: msg.id, result }, transfer)
  } catch (err) {
    note(`${what} → ${err.message}`, true)
    send({ type: 'response', id: msg.id, error: err.message })
  }
})

$('back').onclick = stop
$('rescan').onclick = load
$('toggleLog').onclick = () => $('log').classList.toggle('open')
load()
</script>
</body>
</html>
