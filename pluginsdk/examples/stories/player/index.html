<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stories</title>
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <!-- The web player's own Back button sits top left (top right in
       right-to-left languages), so the reader's controls keep clear of it.
       Done marks the story read; Back, or Escape, leaves it where it is. -->
  <header>
    <div id="bar"><div id="read"></div></div>
    <button id="done" type="button"></button>
  </header>
  <article id="story" tabindex="-1"></article>
  <script type="module" src="reader.js"></script>
</body>
</html>
