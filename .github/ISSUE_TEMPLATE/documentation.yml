name: Documentation
description: Something in the docs is missing, wrong or confusing.
labels: ["documentation"]
body:
  - type: input
    id: where
    attributes:
      label: Where?
      description: A link or file name, such as README.md#kubernetes.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's missing or wrong?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
    validations:
      required: false
