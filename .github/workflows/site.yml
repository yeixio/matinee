name: Site

# The website at matinee.yeix.io: the landing page and the user guide, once
# per release. Pushes to main and release tags rebuild it and publish it to
# the site branch, which the web server pulls.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['docs/**', 'site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['docs/**', 'site/**', '.github/workflows/site.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Every build reads each release's guide from its tag, and /next/ from
      # main, so a release tag builds from main too.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: site
      - run: pnpm build:all
        working-directory: site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist-all

  publish:
    needs: build
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-site
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # Like the packages branch, the site branch is one commit holding just
      # the built site, so old builds don't pile up in the history.
      - name: Publish to the site branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd site
          git init -q -b site
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -qm "Site from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:site
