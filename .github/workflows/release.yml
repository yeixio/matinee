name: Release

# Press Run workflow under Actions → Release to release main. It picks the
# next version (patch by default), checks that main passed CI and has its
# notes in docs/release-notes/<tag>.md, tags it and ships it. Pushing a tag
# such as v0.2.0 by hand still works too.
#
# A version with a suffix (v0.2.0-beta.1) is a pre-release: it gets its own
# image tag but doesn't move :latest, and needs no notes file.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the last version goes up
        type: choice
        options: [patch, minor, major]
        default: patch
      version:
        description: Or an exact version, such as v0.3.0-beta.1 (leave empty to bump)
        type: string
        required: false
      force:
        description: Release even if CI didn't pass on this commit
        type: boolean
        default: false

permissions:
  # actions: read lets a pressed release check CI on the commit.
  actions: read
  contents: write
  packages: write
  pull-requests: write

# One release at a time, so two presses can't pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The tag this run releases: the pushed tag, or a new one on main.
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
          FORCE: ${{ inputs.force && '1' || '' }}
          NOTES_DIR: docs/release-notes
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Release from main, not $GITHUB_REF_NAME."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          scripts/cut-release.sh

  test:
    needs: tag
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: make lint
      - name: Test
        run: |
          set -o pipefail
          # Job logs can't be read from everywhere, so failing tests also go
          # in an annotation on the run.
          if ! go test -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/test.log"; then
            summary="$(grep -E -B2 -A12 '^\s*--- FAIL|^panic:|^FAIL' "$RUNNER_TEMP/test.log" | head -n 60)"
            summary="${summary//'%'/'%25'}"
            summary="${summary//$'\r'/}"
            summary="${summary//$'\n'/'%0A'}"
            echo "::error title=Tests failed::$summary"
            exit 1
          fi

  image:
    needs: [tag, test]
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # v1.2.3 publishes 1.2.3, 1.2 and latest; the chart's appVersion is 1.2.3.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.tag.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.tag.outputs.tag }},enable=${{ !contains(needs.tag.outputs.tag, '-') }}
            type=raw,value=latest,enable=${{ !contains(needs.tag.outputs.tag, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # armv7 for older NAS boxes and Raspberry Pis.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.tag.outputs.tag }}
          secrets: |
            tmdb_key=${{ secrets.TMDB_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: [tag, image]
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart to ghcr.io/yeixio/charts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/matinee --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/matinee-$VERSION.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz

  binaries:
    needs: [tag, test]
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web
      - name: Build archives
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: VERSION="${TAG#v}" scripts/release-binaries.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  # Matinee Server.app: signed, notarized and with its update feed when the
  # signing secrets are set (see mac.yml), otherwise left out.
  mac:
    needs: [tag, test]
    uses: ./.github/workflows/mac.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  packages:
    needs: [tag, binaries]
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build .deb and .rpm packages
        run: VERSION="${TAG#v}" scripts/package-linux.sh
      # A stable release publishes the repositories, so it fails without the
      # signing key rather than publishing them unsigned.
      - name: Build the apt and dnf repositories
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          PACKAGE_REQUIRE_SIGNING: ${{ !contains(needs.tag.outputs.tag, '-') && '1' || '' }}
        run: scripts/package-repos.sh dist/packages
      # Fresh Debian, Ubuntu and Fedora add the repositories as the README
      # says, install Matinee and start it, before anything is published.
      - name: Test the repositories
        if: ${{ !contains(needs.tag.outputs.tag, '-') }}
        run: scripts/test-packages.sh dist/packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: package-repos
          path: dist/packages

  # The Windows installers: the server, the tray app and FFmpeg. They're
  # signed once the Azure signing secrets and variables are set (see
  # docs/packaging.md), and unsigned until then.
  windows:
    needs: [tag, test]
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      - name: Set up signing
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/jsign.jar" https://github.com/ebourg/jsign/releases/download/7.1/jsign-7.1.jar
          echo "cfb48b07fdd2ee199bfc9e71d8dccdde67a799c4793602e446c7a101be62b3c4  $RUNNER_TEMP/jsign.jar" | sha256sum -c -
          az login --service-principal -u "$AZURE_CLIENT_ID" -p "$AZURE_CLIENT_SECRET" --tenant "$AZURE_TENANT_ID" --allow-no-subscriptions > /dev/null
          token=$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)
          echo "::add-mask::$token"
          {
            echo "WINDOWS_SIGNING=1"
            echo "JSIGN_JAR=$RUNNER_TEMP/jsign.jar"
            echo "AZURE_SIGNING_TOKEN=$token"
          } >> "$GITHUB_ENV"
      - name: Build the installers
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: VERSION="${TAG#v}" scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/Matinee-Setup-*.exe

  release:
    needs: [tag, image, chart, binaries, packages, windows, mac]
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      # The Mac app's disk image and appcast.xml, its update feed, which the
      # app reads from the latest release. Missing when the Mac app wasn't
      # signed.
      - uses: actions/download-artifact@v4
        with:
          pattern: mac-release
          merge-multiple: true
          path: dist
      - name: Checksum everything attached
        run: cd dist && rm -f SHA256SUMS.txt && sha256sum -- * > SHA256SUMS.txt
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f dist/Matinee-Server.dmg ]; then export MAC_APP=1; fi
          scripts/release-notes.sh "$TAG" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag }}
          name: Matinee ${{ needs.tag.outputs.tag }}
          prerelease: ${{ contains(needs.tag.outputs.tag, '-') }}
          body_path: notes.md
          files: dist/*

  # Homebrew, apt and dnf serve stable releases; a pre-release must not
  # replace what their users install.
  publish-packages:
    needs: [tag, release]
    if: ${{ !contains(needs.tag.outputs.tag, '-') }}
    env:
      TAG: ${{ needs.tag.outputs.tag }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-packages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: package-repos
          path: packages
      - name: Configure git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
      # The packages branch holds only the current repositories, in one
      # commit, so old packages don't pile up in the git history. apt and
      # dnf read it from raw.githubusercontent.com.
      - name: Publish the apt and dnf repositories
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -a packages/. "$work/"
          cd "$work"
          git init -q -b packages
          git add -A
          git commit -qm "Packages for ${TAG}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Open the Homebrew formula pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}" scripts/write-brew-formula.sh
          cp Formula/matinee.rb /tmp/matinee.rb
          git fetch origin main
          git checkout -f -B formula origin/main
          mkdir -p Formula
          cp /tmp/matinee.rb Formula/matinee.rb
          git add Formula/matinee.rb
          if git diff --cached --quiet; then
            echo "The Homebrew formula on main is current."
            exit 0
          fi
          git commit -m "Publish the Homebrew formula for ${TAG#v}"
          # formula is a release branch, replaced each release.
          git push --force origin HEAD:formula
          if [ -z "$(gh pr list --head formula --base main --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head formula \
              --title "Publish the Homebrew formula for ${TAG#v}" \
              --body "Updates Formula/matinee.rb from the ${TAG} release."
          fi
          # The workflow token can open the pull request but not approve it,
          # so a required review leaves it open rather than failing the release.
          if ! gh pr merge formula --squash --admin; then
            echo "::warning::The Homebrew formula pull request is open and still needs an approving review."
          fi
