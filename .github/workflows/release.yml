name: Release

# Push a tag such as v0.2.0 to release. A tag with a suffix (v0.2.0-beta.1)
# is a pre-release: it gets its own image tag but doesn't move :latest.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: make lint
      - run: go test -count=1 ./...

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          # v1.2.3 publishes 1.2.3, 1.2 and latest; the chart's appVersion is 1.2.3.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # armv7 for older NAS boxes and Raspberry Pis.
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          secrets: |
            tmdb_key=${{ secrets.TMDB_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Package and push the chart to ghcr.io/yeixio/charts
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          helm package deploy/helm/matinee --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/matinee-$VERSION.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*.tgz

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make web
      - name: Build archives
        env:
          TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/release-binaries.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*

  release:
    needs: [image, chart, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cat > notes.md <<EOF
          ### Install

          - **Docker:** \`docker pull ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\`
          - **Kubernetes:** \`helm install matinee oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts/matinee --version ${VERSION}\`
          - **Single binary:** download the archive for your system below. FFmpeg must be on the PATH.
          EOF
      - uses: softprops/action-gh-release@v2
        with:
          name: Matinee ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: notes.md
          files: dist/*
