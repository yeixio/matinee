name: Game emulators

# Builds the game runner and the emulators in games/cores.txt once for each
# Linux CPU the server runs on, for Apple silicon Macs and for Windows (x64),
# and publishes them as a release
# (games/cores-tag.sh names it). The Docker image and the Linux packages
# download them instead of compiling them. MAME is built on its own
# (mame-core.yml). Everything is built on Ubuntu 22.04, whose glibc (2.35)
# is older than any system Matinee runs on, so the emulators load in the
# image and on Debian 12+, Ubuntu 22.04+ and Fedora alike.
on:
  push:
    branches: [main]
    paths: ['games/cores.txt', 'games/build.sh', 'games/cores-tag.sh', 'games/runner/**', 'games/testcore/**', '.github/workflows/game-cores.yml']
  # A pull request that changes them builds them too, to check they build;
  # only main (or a run by hand) publishes.
  pull_request:
    paths: ['games/cores.txt', 'games/build.sh', 'games/cores-tag.sh', 'games/runner/**', 'games/testcore/**', '.github/workflows/game-cores.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=$(sh games/cores-tag.sh games)" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view '${{ steps.v.outputs.tag }}' > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Emulators (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          # 32-bit ARM, cross-built: GitHub has no such runners.
          - { arch: arm, runner: ubuntu-latest, host: arm-linux-gnueabihf }
    steps:
      - name: Get build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates git make cmake gcc g++ binutils libgl-dev nasm xz-utils
          if [ -n '${{ matrix.host }}' ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends gcc-${{ matrix.host }} g++-${{ matrix.host }} binutils-${{ matrix.host }}
          fi
      - uses: actions/checkout@v4
      - name: Build
        run: HOST='${{ matrix.host }}' sh games/build.sh out
      - name: Package
        run: |
          ls -la out out/cores
          tar -C out -cf - . | xz -T0 -6 > 'matinee-games-linux-${{ matrix.arch }}.tar.xz'
          ls -la ./*.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: games-${{ matrix.arch }}
          path: matinee-games-linux-${{ matrix.arch }}.tar.xz
          compression-level: 0

  # Apple silicon Macs, for Matinee Server.app. An emulator that doesn't
  # build or load on a Mac yet is left out (KEEP_GOING), and its games say
  # there's no emulator there.
  build-mac:
    name: Emulators (Mac)
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # The oldest macOS Matinee Server.app runs on.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: KEEP_GOING=1 sh games/build.sh out
      - name: Package
        run: |
          ls -la out out/cores
          file out/matinee-game-runner out/cores/*.so
          tar -C out -cf - . | xz -T0 -6 > matinee-games-darwin-arm64.tar.xz
          ls -la ./*.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: games-darwin-arm64
          path: matinee-games-darwin-arm64.tar.xz
          compression-level: 0

  # Windows, cross-built with MinGW, then checked on real Windows below.
  # The x64 build goes in both installers: Windows on Arm runs x64 programs.
  build-windows:
    name: Emulators (Windows)
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Get build tools
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 nasm
      - uses: actions/checkout@v4
      - name: Build
        run: HOST=x86_64-w64-mingw32 KEEP_GOING=1 sh games/build.sh out
      - name: Package
        run: |
          ls -la out out/cores
          tar -C out -cf - . | xz -T0 -6 > matinee-games-windows-amd64.tar.xz
          ls -la ./*.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: games-windows-amd64
          path: matinee-games-windows-amd64.tar.xz
          compression-level: 0

  test-windows:
    name: Emulators load on Windows
    needs: build-windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: games-windows-amd64
      - name: Every emulator loads, and the runner plays
        run: |
          mkdir games && xz -dc matinee-games-windows-amd64.tar.xz | tar -C games -xf -
          cd games
          for c in cores/*.so; do
            echo "$c: $(./matinee-game-runner.exe --info "$c")"
          done
          # The lag test plays until Matinee (here, printf) closes stdin.
          printf 'B\0\1\0' | ./matinee-game-runner.exe cores/lagtest.so - . . > out.bin
          head -c 1 out.bin | grep -q I
          ls -l out.bin

  publish:
    name: Publish
    needs: [version, build, build-mac, test-windows]
    # On main, or run by hand (to publish emulators before the change that
    # needs them is merged). A run by hand tags main: the token can't tag a
    # commit that changes workflows main doesn't have yet.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: games-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum matinee-games-*.tar.xz > SHA256SUMS
          cat SHA256SUMS
          gh release create '${{ needs.version.outputs.tag }}' matinee-games-*.tar.xz SHA256SUMS \
            --repo '${{ github.repository }}' \
            --target "${{ github.ref == 'refs/heads/main' && github.sha || 'main' }}" \
            --title 'Game emulators (${{ needs.version.outputs.tag }})' \
            --notes 'The game runner and emulators in games/cores.txt, built for Linux (amd64, arm64, 32-bit ARM), Apple silicon Macs and Windows (x64). The Matinee server image, the Linux packages, Matinee Server.app and the Windows installers include them. Each emulator is built from the commit listed in games/cores.txt; its licence is in licenses/.' \
            --latest=false
