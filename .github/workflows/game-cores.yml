name: Game emulators

# Builds the game runner and the emulators in games/cores.txt once for each
# Linux CPU the server runs on, and publishes them as a release
# (games/cores-tag.sh names it). The Docker image and the Linux packages
# download them instead of compiling them. MAME is built on its own
# (mame-core.yml). Everything is built on Ubuntu 22.04, whose glibc (2.35)
# is older than any system Matinee runs on, so the emulators load in the
# image and on Debian 12+, Ubuntu 22.04+ and Fedora alike.
on:
  push:
    branches: [main]
    paths: ['games/cores.txt', 'games/build.sh', 'games/cores-tag.sh', 'games/runner/**', 'games/testcore/**', '.github/workflows/game-cores.yml']
  # A pull request that changes them builds them too, to check they build;
  # only main (or a run by hand) publishes.
  pull_request:
    paths: ['games/cores.txt', 'games/build.sh', 'games/cores-tag.sh', 'games/runner/**', 'games/testcore/**', '.github/workflows/game-cores.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "tag=$(sh games/cores-tag.sh games)" >> "$GITHUB_OUTPUT"
      - id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view '${{ steps.v.outputs.tag }}' > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Emulators (${{ matrix.arch }})
    needs: version
    if: needs.version.outputs.exists != 'true'
    runs-on: ${{ matrix.runner }}
    container: ubuntu:22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          # 32-bit ARM, cross-built: GitHub has no such runners.
          - { arch: arm, runner: ubuntu-latest, host: arm-linux-gnueabihf }
    steps:
      - name: Get build tools
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends ca-certificates git make cmake gcc g++ binutils libgl-dev nasm xz-utils
          if [ -n '${{ matrix.host }}' ]; then
            DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends gcc-${{ matrix.host }} g++-${{ matrix.host }} binutils-${{ matrix.host }}
          fi
      - uses: actions/checkout@v4
      - name: Build
        run: HOST='${{ matrix.host }}' sh games/build.sh out
      - name: Package
        run: |
          ls -la out out/cores
          tar -C out -cf - . | xz -T0 -6 > 'matinee-games-linux-${{ matrix.arch }}.tar.xz'
          ls -la ./*.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: games-${{ matrix.arch }}
          path: matinee-games-linux-${{ matrix.arch }}.tar.xz
          compression-level: 0

  publish:
    name: Publish
    needs: [version, build]
    # On main, or run by hand (to publish emulators before the change that
    # needs them is merged).
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: games-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum matinee-games-linux-*.tar.xz > SHA256SUMS
          cat SHA256SUMS
          gh release create '${{ needs.version.outputs.tag }}' matinee-games-linux-*.tar.xz SHA256SUMS \
            --repo '${{ github.repository }}' \
            --target "$GITHUB_SHA" \
            --title 'Game emulators (${{ needs.version.outputs.tag }})' \
            --notes 'The game runner and emulators in games/cores.txt, built for Linux (amd64, arm64, 32-bit ARM). The Matinee server image and Linux packages include them. Each emulator is built from the commit listed in games/cores.txt; its licence is in licenses/.' \
            --latest=false
