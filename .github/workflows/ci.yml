name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Lint
        run: make lint
      - name: Install Pebble
        # Let's Encrypt's test CA, for internal/remote's certificate test.
        run: |
          go install github.com/letsencrypt/pebble/v2/cmd/pebble@v2.10.1
          echo "PEBBLE_DIR=$(go env GOMODCACHE)/github.com/letsencrypt/pebble/v2@v2.10.1" >> "$GITHUB_ENV"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Test
        env:
          MATINEE_TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable' || '' }}
        run: go test -count=1 -race ./...

  plugin-sdk:
    name: Plugin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: SDK
        working-directory: pluginsdk
        run: |
          go vet ./...
          GOOS=wasip1 GOARCH=wasm go vet .
          go test -count=1 ./...
      - name: Stories example
        working-directory: pluginsdk/examples/stories
        run: |
          go vet ./...
          go test -count=1 ./...
      - name: Build and scan the Stories example with matinee-plugin
        run: |
          go run ./cmd/matinee-plugin build pluginsdk/examples/stories
          go run ./cmd/matinee-plugin scan pluginsdk/examples/stories pluginsdk/examples/stories/testdata/library

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm build
        working-directory: web

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/matinee
      - run: helm template t deploy/helm/matinee > /dev/null
      - run: helm template t deploy/helm/matinee --set discovery.url=https://matinee.example.com > /dev/null
      - run: helm template t deploy/helm/matinee --set gpu.type=vaapi --set 'gpu.vaapi.groups={993}' > /dev/null
      - run: helm template t deploy/helm/matinee --set gpu.type=vaapi --set gpu.vaapi.resource=amd.com/gpu > /dev/null
      - run: helm template t deploy/helm/matinee --set gpu.type=nvidia > /dev/null
      # Recreate needs no drain delay; RollingUpdate waits 5s for the Service.
      - run: "helm template t deploy/helm/matinee | grep -q 'terminationGracePeriodSeconds: 20'"
      - run: "helm template t deploy/helm/matinee --set strategy.type=RollingUpdate | grep -q 'terminationGracePeriodSeconds: 25'"

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Pushes from main publish ghcr.io/yeixio/matinee:main (and :sha-<short>);
      # pull requests only build.
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=main-${{ github.sha }}
          # Empty on pull requests and forks, which then build without a TMDB key.
          secrets: |
            tmdb_key=${{ secrets.TMDB_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The rendezvous service the apps use to find home servers
  # (cmd/matinee-connect). Pushes from main publish
  # ghcr.io/yeixio/matinee-connect:main and :sha-<short>.
  connect-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-connect
          tags: |
            type=ref,event=branch
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/matinee-connect/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=main-${{ github.sha }}
          cache-from: type=gha,scope=connect
          cache-to: type=gha,mode=max,scope=connect

  # Moves the edge branch to each main commit that passed every check and
  # has its image published, so clusters that follow edge only roll out
  # builds they can pull (see "Following the latest build" in the README).
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go, web, helm, docker, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: edge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fast-forward only, so a slow run for an older commit never moves edge back.
      - name: Move edge to this commit
        run: |
          if git rev-parse -q --verify origin/edge > /dev/null &&
            ! git merge-base --is-ancestor origin/edge "$GITHUB_SHA"; then
            echo "edge is already past ${GITHUB_SHA}."
            exit 0
          fi
          git push origin "${GITHUB_SHA}:refs/heads/edge"

  packages:
    name: Linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils createrepo-c rpm
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The packaging is under test here, not the web player, so a stand-in
      # page saves building it.
      - name: Build amd64 packages
        run: |
          echo '<!doctype html><title>Matinee</title>' > web/dist/index.html
          VERSION=0.0.0-ci TARGETS=linux/amd64 scripts/release-binaries.sh
          VERSION=0.0.0-ci scripts/package-linux.sh
      - name: Install from signed apt and dnf repositories
        run: scripts/test-packages.sh

  windows:
    name: Windows installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nsis
      # The installer is under test here, not the web player, so a stand-in
      # page saves building it. It's numbered as the next release, so the
      # tray app doesn't offer the current one as an update.
      - name: Build the installers
        run: |
          echo '<!doctype html><title>Matinee</title>' > web/dist/index.html
          last=$(git tag -l 'v*' --sort=-v:refname | grep -v -- - | head -n 1)
          last=${last#v}
          VERSION="${last%.*}.$(( ${last##*.} + 1 ))" scripts/package-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: dist/Matinee-Setup-*.exe
          retention-days: 1

  windows-test:
    name: Windows (${{ matrix.arch }})
    needs: windows
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-latest }
          - { arch: arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test the tray app and the folder picker on Windows
        run: go test -count=1 ./cmd/matinee-tray/ ; if ($?) { go test -count=1 -run TestWindowsFolderPicker ./internal/api/ }
      - uses: actions/download-artifact@v4
        with:
          name: windows-installers
          path: dist
      - name: Install, run and uninstall
        run: scripts/test-windows-install.ps1 -Installer (Get-Item dist\Matinee-Setup-${{ matrix.arch }}.exe).FullName -Shots shots
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-shots-${{ matrix.arch }}
          path: shots
          retention-days: 3
