openapi: 3.1.0
info:
  title: Matinee API
  version: "1"
  summary: The HTTP API that the web player and Matinee's apps use.
  description: |
    Every path here is under `/api/v1` on a Matinee server, for example
    `https://matinee.example.com/api/v1/home`.

    **Compatibility.** Within v1, changes only add things: new endpoints, new
    optional request fields and new response fields. Clients ignore response
    fields they don't know. Anything that would break a client goes in v2,
    and the server keeps serving v1 alongside it.

    **Signing in.** Send `Authorization: Bearer <token>` with every request.
    Get a token from `POST /auth/login` (username and password) or, on a
    phone or TV, from the code flow: `POST /auth/device`, show the code,
    then poll `POST /auth/device/token` every `interval` seconds until the
    person approves it at `/link` on the server. Media URLs used as `<video>`
    or player sources may carry the token as `?token=` instead.

    **At home.** Devices on the server's home network may browse and play
    without a token, as a shared guest account, unless an admin requires
    signing in there too (`PUT /settings`). `GET /server` says whether this
    device may (`homeAccess`). Only the endpoints that look and play allow
    it; the rest still need a token. Requests that reach the server through
    a proxy or ingress never count as coming from home.

    **Languages.** Titles, descriptions and taglines come in the language the
    current profile picked (`PUT /me/language`) or, until it picks one, the
    first of the device's languages in `Accept-Language` that Matinee has
    (`GET /languages`), where TMDB has a translation; otherwise as they are.

    **Errors** are JSON `{"error": "message", "code": "message_code"}`, with
    an English message fit to show a person. Apps show the code's text from
    their own catalog (`i18n/locales/<language>/errors.json`) and the message
    when the catalog doesn't have the code.
  license:
    name: AGPL-3.0-or-later
    identifier: AGPL-3.0-or-later
servers:
  - url: /api/v1
security:
  - bearer: []

paths:
  /health:
    get:
      summary: Health check
      description: |
        Players ask this when playback breaks off. `state` is `restarting`
        while the server shuts down for an update or a restart (every answer
        then also has the header `Matinee-Restarting: 1`). `bootId` changes
        each time the server starts: the same one as before means only the
        connection dropped, a new one that the server restarted, and a new
        `version` besides that it was updated.
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                  apiVersion: { type: integer }
                  state: { type: string, enum: [ok, restarting] }
                  bootId: { type: string }
  /server/proof:
    post:
      summary: Prove this is the server behind serverId
      description: |
        For an app that found an address through the connect service. Send a
        random nonce (16 to 64 bytes); the server signs
        `"matinee-server-proof v1\n" + host + "\n" + nonce` with its key,
        where host is the address the request was made to, without `:443`.
        Check that the key's id (connect.ID) is the `serverId` you saved and
        that the signature checks out before sending a token. The server only
        signs for its own outside address, so a proof can't be passed along by
        another server.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nonce]
              properties:
                nonce: { type: string, format: byte }
      responses:
        "200":
          description: The proof.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string, format: byte, description: The server's ed25519 public key. }
                  signature: { type: string, format: byte }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /server:
    get:
      summary: What this server is
      description: Apps call this first to check that an address is a Matinee server and which API it speaks.
      security: []
      responses:
        "200":
          description: Server details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
  /openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200":
          description: The OpenAPI document.
          content:
            application/yaml: {}

  /setup:
    get:
      summary: Whether the server still needs its first account
      security: []
      responses:
        "200":
          description: Setup state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsSetup: { type: boolean }
    post:
      summary: Create the first (admin) account and sign in
      description: Works once, on a server with no accounts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /auth/login:
    post:
      summary: Sign in with a username and password
      description: |
        After a few wrong passwords for one username, or many from one
        address, sign-in is refused with 429 and a `Retry-After` header for a
        while, longer each time, up to 15 minutes. Requests from home are
        never refused or counted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - $ref: "#/components/schemas/DeviceInfo"
      responses:
        "200": { $ref: "#/components/responses/SignedIn" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      summary: Sign this device out
      responses:
        "204": { description: Signed out. }

  /auth/device:
    post:
      summary: Start signing in with a code
      description: |
        For devices where typing a password is a chore. Show `userCode` (and
        `verificationUrl`, or a QR code of `verificationUrlComplete`), then poll
        `POST /auth/device/token` every `interval` seconds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/DeviceInfo"
                - required: [deviceName]
      responses:
        "200":
          description: A code to show.
          content:
            application/json:
              schema:
                type: object
                required: [deviceCode, userCode, verificationUrl, verificationUrlComplete, expiresIn, interval]
                properties:
                  deviceCode: { type: string, description: Secret. Keep it on the device and send it when polling. }
                  userCode: { type: string, example: WXYZ-2345, description: What the person types. }
                  verificationUrl: { type: string, example: https://matinee.example.com/link }
                  verificationUrlComplete: { type: string, example: "https://matinee.example.com/link?code=WXYZ2345" }
                  expiresIn: { type: integer, description: Seconds until the code expires. }
                  interval: { type: integer, description: Seconds to wait between polls. }
  /auth/device/token:
    post:
      summary: Ask whether a code was approved
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceCode]
              properties:
                deviceCode: { type: string }
      responses:
        "200":
          description: Approved. The token is returned once; later polls get 410.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: approved }
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string }
        "202":
          description: Not approved yet. Poll again after `interval` seconds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: pending }
        "403": { $ref: "#/components/responses/Error" }
        "410": { $ref: "#/components/responses/Error" }
  /auth/device/{code}:
    parameters:
      - $ref: "#/components/parameters/UserCode"
    get:
      summary: Look up a code someone typed
      description: The signed-in person sees which device they are about to sign in.
      responses:
        "200":
          description: A code waiting for approval.
          content:
            application/json:
              schema:
                type: object
                properties:
                  userCode: { type: string }
                  deviceName: { type: string }
                  platform: { type: string }
                  expiresAt: { type: integer, description: Unix seconds. }
        "404": { $ref: "#/components/responses/Error" }
  /auth/device/{code}/approve:
    parameters:
      - $ref: "#/components/parameters/UserCode"
    post:
      summary: Sign the device in as the current user
      responses:
        "204": { description: Approved. The device's next poll gets a token. }
        "404": { $ref: "#/components/responses/Error" }
  /auth/device/{code}/deny:
    parameters:
      - $ref: "#/components/parameters/UserCode"
    post:
      summary: Decline the sign-in
      responses:
        "204": { description: Declined. The device's next poll gets 403. }
        "404": { $ref: "#/components/responses/Error" }

  /me:
    get:
      summary: The signed-in user
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /me/password:
    put:
      summary: Change your own password
      description: |
        Needs the current password. Every other device you signed in on is
        signed out; this one stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new: { type: string, minLength: 8 }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /me/theme:
    get:
      summary: The theme the current user picked
      responses:
        "200":
          description: Their theme.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTheme" }
    put:
      summary: Pick a theme for the current user, on every device
      description: |
        On the home network without signing in, this is the shared Home
        account's theme. Send `""` to follow the server's default again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MyTheme" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyTheme" }
        "400": { $ref: "#/components/responses/Error" }
  /me/language:
    get:
      summary: The language the current profile picked
      responses:
        "200":
          description: Its language.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyLanguage" }
    put:
      summary: Pick a language for the current profile, on every device
      description: |
        The web player and the apps show themselves in it, and titles and
        descriptions come in it where TMDB has them. On the home network
        without signing in, this is the shared Home account's language. Send
        `""` to follow each device's language again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MyLanguage" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyLanguage" }
        "400": { $ref: "#/components/responses/Error" }
  /me/playback:
    get:
      summary: The current user's auto-play choices
      responses:
        "200":
          description: Their choices; auto-play is on and binge off until they change them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPrefs" }
    put:
      summary: Change the current user's auto-play choices, on every device
      description: |
        On the home network without signing in, these are the shared Home
        account's (or the picked profile's) choices.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlaybackPrefs" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlaybackPrefs" }
        "400": { $ref: "#/components/responses/Error" }
  /streaming:
    get:
      summary: The streaming qualities this device may offer
      description: |
        With adaptive quality on (an admin's choice, off by default), players
        offer Auto, the quality steps listed here and Original, and pass the
        choice to `POST /items/{id}/hls` as `quality`. Away from home a cap
        can apply whether adaptive quality is on or off: a file bigger than
        `cap` should play through a transcode rather than directly.
      responses:
        "200":
          description: What to offer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  adaptive: { type: boolean, description: "Adaptive quality is on: offer Auto, the steps and Original." }
                  steps:
                    type: array
                    description: The quality steps to offer, best first, within the cap. Empty with adaptive quality off.
                    items: { $ref: "#/components/schemas/QualityStep" }
                  cap:
                    description: The best quality this device may stream now (it's away from home and an admin set a cap), or null.
                    oneOf:
                      - { $ref: "#/components/schemas/QualityStep" }
                      - { type: "null" }
  /themes:
    get:
      summary: The themes people can pick, and the server's default
      description: |
        The built-in themes, then the theme files in the server's
        `<data>/themes` folder. No sign-in needed. Colours are complete:
        the ones a theme file left out are filled in. See docs/themes.md.
      security: []
      responses:
        "200":
          description: Themes, the built-in default first.
          content:
            application/json:
              schema:
                type: object
                required: [default, themes]
                properties:
                  default: { type: string, example: matinee, description: What people see until they pick their own. }
                  themes:
                    type: array
                    items: { $ref: "#/components/schemas/Theme" }
  /languages:
    get:
      summary: The languages people can pick
      description: No sign-in needed. English, the source, comes first.
      security: []
      responses:
        "200":
          description: Languages.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Language" }
  /profiles:
    get:
      summary: Who's watching? The account and its profiles
      description: |
        The account the device is signed in to (or the home network's
        guest account) comes first, then its profiles. With no profiles
        the list has just the account, and apps skip the question.
        `current` is the one the device is watching as now.
      responses:
        "200":
          description: The choices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  current: { type: integer }
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/ProfileChoice" }
    post:
      summary: Add a profile to an account (admins)
      description: |
        A kids profile (kidsLevel 1–3) without `libraries` gets every movie
        and TV library, filtered by rating.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileChanges" }
      responses:
        "201":
          description: The new profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /profiles/select:
    post:
      summary: Watch as another profile of the same account
      description: |
        Profiles with a PIN need it, unless the device is already watching
        as that profile. Five wrong PINs lock a profile for a minute (429).
        On the home network without signing in, picking a profile returns a
        `token` (and sets the session cookie) that only works from home and
        only for browsing and playing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: integer }
                pin: { type: string, description: Four digits. }
                deviceName: { type: string, description: For a new home session. }
                platform: { type: string }
      responses:
        "200":
          description: Switched.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  token: { type: string, description: Only for a new home session. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /profiles/manage:
    get:
      summary: Every account with its profiles (admins)
      description: The home network's guest account comes first.
      responses:
        "200":
          description: Accounts, avatar colours and kids levels to choose from.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        account: { $ref: "#/components/schemas/User" }
                        profiles:
                          type: array
                          items: { $ref: "#/components/schemas/Profile" }
                  avatars: { type: array, items: { type: string } }
                  levels:
                    type: array
                    items:
                      type: object
                      properties:
                        level: { type: integer }
                        name: { type: string }
        "403": { $ref: "#/components/responses/Error" }
  /profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      summary: Change a profile (admins)
      description: |
        Fields left out stay as they are. For an account, only `pin` and
        `avatar` can be set; an account's PIN guards it in "Who's watching?".
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileChanges" }
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a profile with its progress and watch list (admins)
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
  /devices:
    get:
      summary: Devices signed in as the current user
      responses:
        "200":
          description: Most recently used first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Device" }
  /devices/{id}:
    delete:
      summary: Sign a device out
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Signed out. }
        "404": { $ref: "#/components/responses/Error" }
  /settings:
    get:
      summary: Server-wide settings (admins only)
      responses:
        "200":
          description: Settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }
    put:
      summary: Change server-wide settings (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Settings" }
      responses:
        "200":
          description: The settings now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Settings" }

  /settings/connect/plans:
    get:
      summary: What Matinee Connect costs (admins only)
      description: |
        Matinee Connect is the paid service that lets the apps find this
        server after its public address changes (docs/connect.md). 404 when
        the server uses a service that needs no subscription.
      responses:
        "200":
          description: The plans.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plans:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, enum: [monthly, yearly] }
                        price: { type: string, description: Ready to show, such as `$3.99`. }
                        interval: { type: string, enum: [month, year] }
  /settings/connect/subscribe:
    post:
      summary: Start buying Matinee Connect for this server (admins only)
      description: Opens a checkout; open `url` for the person to pay. `remote.connect` in the settings says when it's active.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan: { type: string, enum: [monthly, yearly] }
      responses:
        "200":
          description: The checkout's page.
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string } } }
  /settings/connect/manage:
    post:
      summary: Change the card or cancel Matinee Connect (admins only)
      responses:
        "200":
          description: The billing page to open.
          content:
            application/json:
              schema: { type: object, properties: { url: { type: string } } }

  /users:
    get:
      summary: Everyone with an account (admins only)
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
    post:
      summary: Add an account (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Credentials"
                - properties:
                    isAdmin: { type: boolean }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}:
    patch:
      summary: Make an account an admin or not (admins only)
      description: The last admin can't stop being one (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isAdmin: { type: boolean }
      responses:
        "200":
          description: The account as it is now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove an account (admins only)
      description: |
        Removes the account with its sessions, downloads, watch history, watch
        list, requests and problem reports. Admins can't remove themselves
        (400), and the last admin can't be removed (409).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Removed. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /users/{id}/password:
    put:
      summary: Set someone's password (admins only)
      description: |
        No current password needed. The account is signed out on every
        device, except this one when admins reset their own.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 8 }
      responses:
        "204": { description: Changed. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /libraries:
    get:
      summary: All libraries
      parameters:
        - { name: counts, in: query, schema: { type: string, enum: ["1"] }, description: "Admins: include titles and files." }
      responses:
        "200":
          description: Libraries, by name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Library" }
    post:
      summary: Add a library and start scanning it (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, paths]
              properties:
                name: { type: string }
                kind: { type: string, examples: [movies, tv, music, audiobooks, podcasts] }
                paths: { type: array, items: { type: string }, description: Folders on the server. }
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Library" }
        "400": { $ref: "#/components/responses/Error" }
  /libraries/{id}:
    delete:
      summary: Remove a library (admins only). Files stay where they are.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
  /libraries/{id}/scan:
    post:
      summary: Scan a library for new and changed files (admins only)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202": { description: Scanning. Watch `scanning` on GET /libraries. }
  /libraries/{id}/artwork:
    post:
      summary: Find missing artwork in a music or audiobook library (admins only)
      description: >
        Scans the library, which picks up covers added to folders since, then
        looks up online again every artist, album, author and book without a
        picture from its own files, including ones not matched before.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202":
          description: Looking. Watch `scanning` on GET /libraries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lookingUp: { type: integer, description: How many items will be looked up online again }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /libraries/{id}/items:
    get:
      summary: A library's top level (movies, shows or artists), filtered and sorted
      description: >
        With no filter, everything at the library's top level in title order.
        Any ItemFilter field narrows the list, e.g.
        `?genre=Comedy&yearMin=1980&yearMax=1989&watched=unwatched&sort=rating`.
        `library` is taken from the path.
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { $ref: "#/components/parameters/Filter" }
      responses:
        "200": { $ref: "#/components/responses/Items" }
        "400": { $ref: "#/components/responses/Error" }
  /libraries/{id}/filters:
    get:
      summary: What a library can be filtered by
      description: The values its titles have, most common first, and which ranges are worth offering.
      parameters:
        - { $ref: "#/components/parameters/ID" }
      responses:
        "200":
          description: Filter choices.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FilterOptions" }
        "404": { $ref: "#/components/responses/Error" }
  /libraries/{id}/people:
    get:
      summary: Find people credited in a library, for the person and director filters
      parameters:
        - { $ref: "#/components/parameters/ID" }
        - { name: q, in: query, schema: { type: string }, description: Matches the start of any word of a name; empty lists the most credited. }
        - { name: role, in: query, schema: { type: string, enum: [cast, director] }, description: Empty matches any credit. }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        "200":
          description: People, in the most titles first.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/FilterPerson" } }
        "404": { $ref: "#/components/responses/Error" }
  /libraries/{id}/series:
    get:
      summary: An audiobook library's series
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Series by name. List a series' books with /libraries/{id}/items?kind=book&series=…&sort=series.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BookGroup" } }
        "404": { $ref: "#/components/responses/Error" }
  /libraries/{id}/narrators:
    get:
      summary: Who narrates an audiobook library's books
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Narrators by name. List their books with /libraries/{id}/items?kind=book&narrator=….
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/BookGroup" } }
        "404": { $ref: "#/components/responses/Error" }
  /items:
    get:
      summary: Titles across libraries, filtered and sorted
      description: Like /libraries/{id}/items, with `library` choosing libraries (none means all).
      parameters:
        - { $ref: "#/components/parameters/Filter" }
      responses:
        "200": { $ref: "#/components/responses/Items" }
        "400": { $ref: "#/components/responses/Error" }
  /fs:
    get:
      summary: Browse the server's folders, to pick library folders (admins only)
      parameters:
        - { name: path, in: query, schema: { type: string }, description: "Empty starts at the server's media folder. On a Windows server, / lists the drives." }
      responses:
        "200":
          description: Subfolders.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path: { type: string }
                  parent: { type: string }
                  dirs: { type: array, items: { type: string }, description: The subfolders' names. }
                  paths: { type: array, items: { type: string }, description: The subfolders' full paths, in the same order. }
                  drives: { type: boolean, description: "True when this is a Windows server's list of drives, which isn't a folder to pick." }
  /import:
    get:
      summary: How the import from another media server is going (admins only)
      responses:
        "200":
          description: Whether one is running, how far along it is, and what the last one did.
          content:
            application/json:
              schema:
                type: object
                properties:
                  running: { type: boolean }
                  done: { type: integer }
                  total: { type: integer }
                  result: { $ref: "#/components/schemas/ImportResult" }
                  error: { type: string }
  /import/find:
    get:
      summary: Another media server's data folders found on this computer (admins only)
      responses:
        "200":
          description: Folders found where that server keeps its data by default, and whether a database was uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  found: { type: array, items: { type: string } }
                  uploaded: { type: boolean }
  /import/upload:
    post:
      summary: Upload another media server's library database (admins only)
      description: >
        For a server that can't see the other one's data folder. The body is
        the database file itself. An import from an upload brings over watch
        history and collections, but not posters, which live beside it.
      requestBody:
        content:
          application/octet-stream: {}
      responses:
        "204": { description: Uploaded and readable. }
        "400": { $ref: "#/components/responses/Error" }
  /import/preview:
    post:
      summary: What an import would bring over (admins only)
      description: >
        Reads the other server's data and matches its files to Matinee's by
        path, after the path changes given. Suggests path changes that would
        match more files, and the Matinee account or profile each of its
        accounts most likely is.
      requestBody:
        content:
          application/json: { schema: { $ref: "#/components/schemas/ImportRequest" } }
      responses:
        "200":
          description: The preview.
          content:
            application/json:
              schema:
                type: object
                properties:
                  database: { type: string, description: The database read. }
                  canPosters: { type: boolean, description: "False for an uploaded database, which has no posters beside it." }
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        watched: { type: integer }
                        inProgress: { type: integer }
                        rated: { type: integer }
                        found: { type: integer, description: How many of those Matinee has. }
                        suggested: { type: integer, description: "A Matinee account or profile id, or 0." }
                  viewers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        profileOf: { type: string }
                  files: { type: integer }
                  matched: { type: integer }
                  unmatched: { type: array, items: { type: string }, description: A few files Matinee doesn't have. }
                  suggested: { type: array, items: { $ref: "#/components/schemas/PathChange" } }
                  collections: { type: integer }
                  posters: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
  /import/run:
    post:
      summary: Start an import (admins only)
      description: >
        Runs in the background; GET /import follows it. Watched marks and
        places only replace Matinee's when the other server's are newer, and
        collections are added to rather than made twice, so it's safe to run
        again.
      requestBody:
        content:
          application/json: { schema: { $ref: "#/components/schemas/ImportRequest" } }
      responses:
        "202": { description: Started. }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /analysis:
    get:
      summary: How far the background media analysis is (admins only)
      description: >
        The server slowly reads every file once more in the background, at the
        lowest priority, to record resolution, HDR, codecs, bitrates, audio
        channels and languages, and subtitles. A file is read again only when
        it changes.
      responses:
        "200":
          description: Progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisStatus" }
    put:
      summary: Set how hard the media analysis works (admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: "#/components/schemas/AnalysisMode" }
      responses:
        "200":
          description: Progress, with the new mode.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnalysisStatus" }
        "400": { $ref: "#/components/responses/Error" }
  /items/{id}/analyze:
    post:
      summary: Analyze one file again soon (admins only)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "202": { description: Queued. It's analyzed next unless the analysis is off. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /home:
    get:
      summary: The home screen's rows
      responses:
        "200":
          description: Rows of items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  continueWatching: { type: array, items: { $ref: "#/components/schemas/Item" } }
                  watchList: { type: array, description: "The newest 30 on the watch list.", items: { $ref: "#/components/schemas/Item" } }
                  recentlyAdded: { type: array, items: { $ref: "#/components/schemas/Item" } }
                  newReleases:
                    type: array
                    description: Movies and shows from this year and last, newest first.
                    items: { $ref: "#/components/schemas/Item" }
                  rows:
                    type: array
                    description: >-
                      Rows shown below the others. First, Continue listening (id
                      continueListening): up to 20 audiobooks and podcast episodes the person started and
                      didn't finish, the latest first; left out when there are none. Then New episodes (id
                      newEpisodes): up to 30 episodes from the last two weeks of the podcasts the person
                      follows that they haven't started, newest first; left out when there are none. Then, in the 30 days before a holiday
                      (a week for New Year's Eve), a row of up to 20 titles for it, if at
                      least four fit; unless an admin turned holiday rows off. Then the collections pinned to Home
                      (shared ones and the person's own, empty ones left out), each with
                      up to 20 titles. Then the day's genre rows: a few genres with at
                      least four titles, different each day, each with up to 20 of its
                      best-rated titles in a daily order. Empty until titles have genres.
                    items:
                      type: object
                      properties:
                        id: { type: string, examples: ["genre:Science Fiction", "collection:4f1c9e0a2b7d3e5f6a8b9c0d", "holiday:halloween", continueListening] }
                        title: { type: string, examples: [Sci-fi favorites] }
                        genre: { type: string, description: Empty on a collection's or a holiday's row., examples: [Science Fiction] }
                        holiday:
                          type: string
                          enum: [valentines, easter, halloween, thanksgiving, christmas, newyear]
                          description: Set on a holiday's row.
                        collectionId: { type: string, description: Set on a pinned collection's row. }
                        starter: { type: string, examples: [tonight], description: Set on a built-in collection's row, which apps may name in their own language while it keeps its English name. }
                        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
                        more: { type: boolean, description: "The row has more titles than it shows; GET /rows/{id} has them all." }
                  more:
                    type: object
                    description: "Which of the lists above have more titles than they show (up to 20 in Continue watching, 30 in the others); GET /rows/{id} has them all, by the list's name."
                    properties:
                      continueWatching: { type: boolean }
                      recentlyAdded: { type: boolean }
                      newReleases: { type: boolean }
                      watchList: { type: boolean }
  /rows/{id}:
    get:
      summary: All of a row's titles
      description: |
        For the See more at the end of a row. Rows are Home's lists
        (continueWatching, recentlyAdded, newReleases, watchList), Home's
        other rows by their id (continueListening, newEpisodes, genre:{genre}, holiday:{id},
        collection:{id}), and related:{item id} for the titles like one
        (More like this). Up to 1,000 titles, in the row's order; a genre's
        or a holiday's best rated first.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, examples: { genre: { value: "genre:Science Fiction" } } }
      responses:
        "200":
          description: The row, as in /home's rows, with relatedTo (the title it's like) on a related row.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  title: { type: string, description: In English. }
                  genre: { type: string }
                  holiday: { type: string }
                  collectionId: { type: string }
                  starter: { type: string }
                  relatedTo: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        "404": { $ref: "#/components/responses/Error" }
  /search:
    get:
      summary: Search titles
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Items" }
  /search/play:
    get:
      summary: The one thing to play for what someone asked for out loud
      description: |
        For voice requests ("play Abbey Road on Matinee") from Siri, Google
        Assistant and Android Auto. q is what was said, such as "Yesterday
        by the Beatles", "the album Thriller" or "The Hobbit audiobook", or
        just the title when the phone already split it up into kind,
        artist and album. Picks an artist, album, song or audiobook: of the
        kind asked for, by whoever was named, closest title first, and for
        a plain "play X" an artist over an album over a book over a song.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [artist, album, track, book] } }
        - { name: artist, in: query, description: Who made it, or who wrote a book., schema: { type: string } }
        - { name: album, in: query, description: The album a song is on., schema: { type: string } }
      responses:
        "200":
          description: What to play.
          content:
            application/json:
              schema:
                type: object
                required: [kind, item]
                properties:
                  kind: { type: string, enum: [artist, album, track, book] }
                  item: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}:
    get:
      summary: One item, with its parents and subtitle tracks
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The item.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ItemDetail" }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/children:
    get:
      summary: Seasons of a show, episodes of a season, albums of an artist, tracks of an album, books of an author, parts of a book
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Items" }
  /items/{id}/tracks:
    get:
      summary: Every track of an artist or album
      description: |
        In playing order: the artist's albums oldest first, then each album
        by disc and track number. For a track, its album's tracks.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { $ref: "#/components/responses/Items" }
  /items/{id}/levels:
    get:
      summary: A song's sound levels, for the music visualizer
      description: |
        How loud each part of the song's sound is, moment by moment: fps
        moments a second, each with bands values from the bass up to the
        treble (40 Hz to 5 kHz, spaced the way ears hear them). Each value is
        a byte, 0 for silence to 255 for as loud as that band gets in the
        song; levels is all of them in order, base64 encoded. The first
        request for a song takes a moment while the server listens to it.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The levels.
          content:
            application/json:
              schema:
                type: object
                required: [fps, bands, levels]
                properties:
                  fps: { type: integer, example: 20 }
                  bands: { type: integer, example: 24 }
                  levels: { type: string, format: byte }
        "400": { description: Not a song. }
        "422": { description: The song's sound couldn't be read. }
  /items/{id}/book:
    get:
      summary: An audiobook with its parts and chapters
      description: |
        A book plays as one long listen across its parts, the files it comes
        in. Times are on the book's own clock: a part starts where the one
        before it ends. Chapters are the parts' own marked chapters, or one
        per part for parts without any. positionMs and played are the
        signed-in person's place in the whole book. For a part, its book.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The book.
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Item" }
                  - type: object
                    properties:
                      parts:
                        type: array
                        description: In playing order. Play each with /items/{id}/file, or /items/{id}/hls when the format won't play.
                        items:
                          allOf:
                            - { $ref: "#/components/schemas/Item" }
                            - type: object
                              properties:
                                startMs: { type: integer, description: Where on the book's clock the part starts. }
                                mimeType: { type: string }
                      chapters:
                        type: array
                        items:
                          type: object
                          properties:
                            title: { type: string }
                            startMs: { type: integer }
                            endMs: { type: integer }
                            partId: { type: integer, description: The part the chapter is in. }
        "404": { $ref: "#/components/responses/Error" }
  /podcasts/directory:
    get:
      summary: Find podcasts in Podcast Index
      description: |
        Searches Podcast Index (podcastindex.org) with `q`, or lists what's
        trending in a language with `lang` (such as en), in every category or
        in one `category` (an `id` from `categories`, such as comedy).
        `categories` lists the kinds of shows to browse, with English names
        the apps translate by id (podcasts.categories.<id>). `connected` is
        false when no admin entered a Podcast Index key, and then `shows` is
        empty: shows can still be added by their feed's address. A show a
        library has already carries its `itemId`. Not on kids profiles.
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: lang, in: query, schema: { type: string } }
        - { name: category, in: query, schema: { type: string } }
      responses:
        "200":
          description: Shows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  shows: { type: array, items: { $ref: "#/components/schemas/DirectoryShow" } }
                  categories:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
        "502": { $ref: "#/components/responses/Error" }
  /podcasts/following:
    get:
      summary: The podcasts the signed-in person follows
      description: The show with the newest episode first, each with how many of its episodes the person hasn't played.
      responses:
        "200":
          description: Shows.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - { $ref: "#/components/schemas/Item" }
                    - type: object
                      properties:
                        unplayed: { type: integer }
  /podcasts:
    post:
      summary: Add a podcast to a podcast library
      description: |
        Reads the show's feed and adds the show with its episodes, or finds
        it if the library has it already, and follows it for the signed-in
        person. feed://, podcast:// and addresses without https:// work too.
        Episodes play through /items/{id}/file and /items/{id}/hls like any
        other item: the server fetches them from the show's host. Not on
        kids profiles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [libraryId, feedUrl]
              properties:
                libraryId: { type: integer }
                feedUrl: { type: string }
      responses:
        "201":
          description: The show.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Item" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /podcasts/{id}:
    delete:
      summary: Remove a podcast and its episodes (admins only)
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
  /podcasts/{id}/refresh:
    post:
      summary: Check a podcast's feed for new episodes now
      description: Feeds are checked every hour anyway, and scanning a podcast library checks all of its shows.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: How many episodes are new.
          content:
            application/json:
              schema: { type: object, properties: { added: { type: integer } } }
        "502": { $ref: "#/components/responses/Error" }
  /podcasts/{id}/follow:
    put:
      summary: Follow a podcast
      description: New episodes of the shows someone follows are on Home's newEpisodes row.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Following. }
    delete:
      summary: Stop following a podcast
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Not following. }
  /podcasts/{id}/played:
    put:
      summary: Mark every episode of a podcast played or unplayed
      description: Unplayed also forgets where the person was in each.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, properties: { played: { type: boolean } } }
      responses:
        "204": { description: Marked. }
  /libraries/{id}/opml:
    get:
      summary: A podcast library's shows as an OPML file
      description: For moving them to another podcast app or server.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The file.
          content:
            text/x-opml: {}
        "400": { $ref: "#/components/responses/Error" }
    post:
      summary: Add every podcast in an OPML file
      description: |
        The body is an OPML file exported from another podcast app. Each show
        is added and followed for the signed-in person; the answer lists the
        ones that couldn't be. Not on kids profiles.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          text/x-opml: {}
      responses:
        "200":
          description: What was added.
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        feedUrl: { type: string }
                        error: { type: string }
        "400": { $ref: "#/components/responses/Error" }
  /items/{id}/related:
    get:
      summary: Titles in the library like a movie or show
      description: |
        The movie's collection (such as a franchise's films) with the ones in
        the library, and other titles like it: ones TMDB recommends, by the
        same director or creator, with the same leads, keywords and genres.
        Only titles in the library are listed. Empty for other kinds.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Related titles.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collection:
                    type: object
                    description: Absent when the title is in no collection, or is the only one of it in the library.
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      items: { type: array, items: { $ref: "#/components/schemas/Item" }, description: Oldest first, including this title. }
                  items: { type: array, items: { $ref: "#/components/schemas/Item" }, description: Best match first; at most 20. }
                  more: { type: boolean, description: "There are more than 20; GET /rows/related:{id} has them all." }
  /items/{id}/next:
    get:
      summary: What to offer when an episode ends
      description: |
        The next episode: the next in its season, else the first of the
        following season (specials only lead to other specials). After a
        show's last episode, a similar title the user hasn't watched instead,
        to open rather than play. Both are absent for anything else, or when
        there's nothing to offer. Players show the offer from the episode's
        `mediaInfo.creditsMs`, else 30 seconds before the end; see
        docs/autoplay.md.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The offer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next: { $ref: "#/components/schemas/Item" }
                  similar: { $ref: "#/components/schemas/Item" }
  /people/{id}:
    get:
      summary: Someone in the cast or crew, and their titles in the library
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Person" }
        "404": { $ref: "#/components/responses/Error" }
  /people/{id}/image:
    get:
      summary: A person's photo
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: size, in: query, schema: { type: string, enum: [large] }, description: "large asks for a photo sharp enough for a 4K TV." }
      responses:
        "200": { description: The image., content: { image/*: {} } }
        "404": { description: No photo. }
  /items/{id}/progress:
    put:
      summary: Save where playback is
      description: |
        A position past 92% of the duration marks the item played. For an
        audiobook, the position is on the whole book's clock (see
        /items/{id}/book), and reaching its last minute finishes it; its
        parts count as played with it. A position in one of a book's parts
        is saved as the place in the book, and a played part moves the
        place on to the next part.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                positionMs: { type: integer }
                played: { type: boolean }
      responses:
        "204": { description: Saved. }
  /continue-watching/{id}:
    delete:
      summary: Take an item off Continue Watching
      description: |
        The item keeps its place, so its page still offers to resume. Saving
        progress for it again (playing it) brings it back to the row.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Off the row (or it wasn't on it). }
  /items/{id}/image/{type}:
    get:
      summary: An item's poster or backdrop
      description: Seasons, tracks and book parts without their own poster get their show's, album's or book's.
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: type, in: path, required: true, schema: { type: string, enum: [poster, backdrop] } }
        - { name: size, in: query, schema: { type: string, enum: [large] }, description: "large asks for art sharp enough for a 4K TV: the original backdrop and the largest poster, where the source has them." }
      responses:
        "200": { description: The image., content: { image/*: {} } }
        "404": { description: No image. }
  /items/{id}/covers:
    get:
      summary: Covers to pick from for an album or book (admins)
      description: |
        Found online by the album's tagged MusicBrainz ids or its title and
        artist: each edition's front cover on the Cover Art Archive, then
        Apple's and Deezer's. For a book: Open Library's and Apple's. None
        needs a key. Sources that don't answer are left out.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The covers, and whether the item has a picked cover now.
          content:
            application/json:
              schema:
                type: object
                properties:
                  options:
                    type: array
                    items:
                      type: object
                      properties:
                        url: { type: string, description: The full-size image. }
                        thumb: { type: string, description: A small one for the list. }
                        source: { type: string, example: Cover Art Archive }
                        title: { type: string }
                        detail: { type: string, description: "Which edition: date, country, format." }
                  chosen: { type: boolean }
                  chosenSource: { type: string, description: "Where the picked cover came from: its URL, or upload." }
        "400": { $ref: "#/components/responses/Error" }
  /items/{id}/cover:
    put:
      summary: Pick an album's or book's cover (admins)
      description: |
        Send `{"url": "https://…"}` as JSON for an image online, which the
        server downloads, or the image itself (JPEG, PNG, WebP or GIF, up to
        20 MB) as the body. The cover is kept on the server and wins over
        the folder's, the files' and online ones until it's reset. The item
        gets a `posterTag`; add it to the image URL as `?v=` so clients
        don't show the old cover from a cache.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json: { schema: { type: object, properties: { url: { type: string } } } }
          image/*: {}
      responses:
        "200": { description: The item with its new cover., content: { application/json: { schema: { $ref: "#/components/schemas/Item" } } } }
        "400": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      summary: Go back to the automatic cover (admins)
      description: >
        Forgets the picked cover; a scan of the library finds one in the
        folder, the files or online again. Works for any item with a
        `posterTag`, such as a movie whose poster was imported.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Reset. }
        "400": { $ref: "#/components/responses/Error" }
  /items/{id}/file:
    get:
      summary: The original file, for direct play and downloads
      description: Supports Range requests, so players can seek and downloads can resume.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200": { description: The file. }
        "206": { description: Part of the file. }
  /items/{id}/subtitles/{track}:
    get:
      summary: A text subtitle track as WebVTT
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: track, in: path, required: true, schema: { type: string }, description: "A track id, optionally ending in .vtt." }
      responses:
        "200": { description: WebVTT., content: { text/vtt: {} } }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/hls:
    post:
      summary: Start a transcode for players that can't play the file directly
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: start, in: query, schema: { type: number }, description: Seconds into the file. }
        - { name: subtitle, in: query, schema: { type: string }, description: A subtitle track to burn in (picture-based tracks). }
        - { name: audio, in: query, schema: { type: integer, minimum: 0 }, description: "Which audio stream to play: its index among the file's audio streams (mediaInfo.audio[].index). The first when left out." }
        - name: quality
          in: query
          schema: { type: string, example: auto }
          description: |
            `auto` for an adaptive stream of several quality steps (a master
            playlist), a step's id (`720p`) for that quality alone, or
            `original` (the default) for the file's own picture where it can.
            With adaptive quality off every request gets `original`; away from
            home a cap brings anything better down to it. See `GET /streaming`.
      responses:
        "200":
          description: An HLS playlist to play.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: /api/v1/hls/abc123/index.m3u8, description: "index.m3u8, or master.m3u8 for an adaptive stream." }
                  startSec: { type: number }
                  audio: { type: integer, description: The audio stream playing. Servers from before audio choice leave it out. }
                  quality: { type: string, description: "The quality made: auto, original or a step's id. Servers from before quality choice leave it out." }
        "400": { description: No such subtitle or audio track, or quality step. }
        "409": { description: A newer start for the same item replaced this one. }
  /items/{id}/trailers:
    get:
      summary: A movie's, show's or season's trailers
      description: |
        Trailer files next to the media come first (`Movie-trailer.mkv`,
        `trailer.mp4`, or anything in a `Trailers` folder), then up to three
        YouTube trailers from TMDB unless an admin turned those off. A season
        without its own trailers lists its show's. Empty when there are none.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: Trailers, best first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trailer" }
  /items/{id}/trailers/{trailer}/file:
    get:
      summary: A local trailer's file, for direct play
      description: Supports Range requests.
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: trailer, in: path, required: true, schema: { type: string }, description: "A local trailer's id, e.g. local-0." }
      responses:
        "200": { description: The file. }
        "206": { description: Part of the file. }
        "404": { $ref: "#/components/responses/Error" }
  /items/{id}/trailers/{trailer}/hls:
    post:
      summary: Start a transcode of a local trailer
      description: Like `/items/{id}/hls`. It replaces the viewer's transcode of the title itself.
      parameters:
        - $ref: "#/components/parameters/ID"
        - { name: trailer, in: path, required: true, schema: { type: string } }
        - { name: start, in: query, schema: { type: number }, description: Seconds into the trailer. }
      responses:
        "200":
          description: An HLS playlist to play.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string, example: /api/v1/hls/abc123/index.m3u8 }
                  startSec: { type: number }
        "404": { $ref: "#/components/responses/Error" }
  /hls/{session}/{file}:
    get:
      summary: A transcode's playlist and segments
      parameters:
        - { name: session, in: path, required: true, schema: { type: string } }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: Playlist or segment. }

  /watchlist:
    get:
      summary: The signed-in person's watch list, newest first
      description: |
        Movies and shows saved to watch later. A movie leaves the list once
        it's watched; a show stays until it's removed. Devices at home that
        haven't signed in share the Home account's list.
      responses:
        "200": { $ref: "#/components/responses/Items" }
  /items/{id}/rating:
    put:
      summary: Rate a title, song, book or podcast
      description: Ratings are each person's own, from 1 to 10 (half stars out of five). Items carry it as `myRating`.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      requestBody:
        content:
          application/json: { schema: { type: object, required: [rating], properties: { rating: { type: integer, minimum: 1, maximum: 10 } } } }
      responses:
        "204": { description: Rated. }
        "400": { $ref: "#/components/responses/Error" }
    delete:
      summary: Take back a rating
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Done. }
  /watchlist/{id}:
    put:
      summary: Add a movie or show to the watch list
      description: Adding one that's already there keeps its place.
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: On the list. }
        "400": { description: Not a movie or show. }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Take an item off the watch list
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "204": { description: Off the list (or it wasn't on it). }

  /playlists:
    get:
      summary: The person's playlists, or the ones with a given name
      description: |
        Playlists are songs someone puts in their own order. Each person and
        profile has their own; devices at home that haven't signed in share
        the Home account's. Counts, lengths and covers only go by songs the
        person may play. Without q, the most recently changed come first.
      parameters:
        - name: q
          in: query
          description: |
            Find playlists by name, as someone would say it: the same name
            first, then names starting with it, then names holding it. Case,
            accents and punctuation don't count. Others are left out.
          schema: { type: string }
      responses:
        "200":
          description: Playlists, without their songs.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Playlist" } }
    post:
      summary: Make a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                items:
                  type: array
                  description: Songs to start with. An album or artist adds all their songs, in album order.
                  items: { type: integer }
      responses:
        "201": { $ref: "#/components/responses/PlaylistWithSongs" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /playlists/{id}:
    parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
    get:
      summary: A playlist and its songs, in order
      responses:
        "200": { $ref: "#/components/responses/PlaylistWithSongs" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Rename a playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
      responses:
        "200": { $ref: "#/components/responses/PlaylistWithSongs" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a playlist
      responses:
        "204": { description: Deleted. }
        "404": { $ref: "#/components/responses/Error" }
  /playlists/{id}/items:
    parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
    post:
      summary: Add songs to the end of a playlist
      description: An album or artist adds all their songs. A song already on the playlist goes on again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items: { type: array, items: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/PlaylistWithSongs" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /playlists/{id}/entries/{entry}:
    parameters:
      - { $ref: "#/components/parameters/PlaylistID" }
      - { name: entry, in: path, required: true, schema: { type: string }, description: The entry's entryId. }
    delete:
      summary: Take one song off a playlist
      responses:
        "200": { $ref: "#/components/responses/PlaylistWithSongs" }
        "404": { $ref: "#/components/responses/Error" }
  /playlists/{id}/order:
    parameters: [{ $ref: "#/components/parameters/PlaylistID" }]
    put:
      summary: Put a playlist's songs in a new order
      description: Entries left out follow in the order they had; ids not on the playlist are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/PlaylistWithSongs" }
        "404": { $ref: "#/components/responses/Error" }

  /collections:
    get:
      summary: Collections and box sets
      description: |
        The shared collections and the person's own, shared first, each in
        the order it was made, with how many titles it has and the first 12.
        A smart collection is evaluated for whoever asks, so its watched
        rules follow their progress. Box sets are TMDB's collections (such
        as a trilogy) with two or more titles in the libraries.
      parameters:
        - name: library
          in: query
          description: Only the collections pinned to this library's page, with up to 20 titles each, and no box sets.
          schema: { type: integer }
        - name: item
          in: query
          description: Say in `contains` whether each manual collection holds this item.
          schema: { type: integer }
      responses:
        "200":
          description: Collections and box sets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  collections: { type: array, items: { $ref: "#/components/schemas/Collection" } }
                  boxSets: { type: array, items: { $ref: "#/components/schemas/BoxSet" } }
    post:
      summary: Make a collection
      description: |
        Signed-in accounts only. It's the maker's own unless an admin shares it
        with everyone (`shared`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "201":
          description: Made, with its first 12 titles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { description: Only an admin can share a collection. }
  /collections/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:
      summary: A collection with all its titles
      responses:
        "200":
          description: The collection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Change a collection
      description: |
        Its name, rules, order and pins. Its kind and owner don't change.
        Shared collections are changed by admins; others by their owner.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
      responses:
        "200":
          description: Changed, with its first 12 titles.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collection" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a collection
      description: The titles stay in the library.
      responses:
        "204": { description: Deleted. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /collections/{id}/items/{item}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: item, in: path, required: true, schema: { type: integer } }
    put:
      summary: Add a title to a manual collection
      description: Adding one that's already there keeps its place.
      responses:
        "204": { description: In the collection. }
        "400": { description: A smart collection fills itself. }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Take a title out of a manual collection
      responses:
        "204": { description: Out of the collection (or it wasn't in it). }
        "400": { description: A smart collection fills itself. }
        "403": { $ref: "#/components/responses/Error" }
  /box-sets/{id}:
    get:
      summary: A box set's titles in the library, oldest first
      parameters: [{ $ref: "#/components/parameters/ID" }]
      responses:
        "200":
          description: The box set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, description: TMDB collection id }
                  name: { type: string }
                  items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        "404": { $ref: "#/components/responses/Error" }

  /downloads/qualities:
    get:
      summary: Qualities a download can be converted to
      responses:
        "200":
          description: Best first. `original` is the file as it is.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, examples: [original, 1080p, 720p, 480p] }
                    label: { type: string }
                    height: { type: integer }
                    videoBps: { type: integer }
                    audioBps: { type: integer }
  /downloads:
    post:
      summary: Download an item to this device
      description: |
        Creates a job that prepares the file: the original as is, or a single
        MP4 (M4A for music) at the chosen quality, converted in the background.
        Poll `GET /downloads/{id}` until `state` is `ready`, then fetch `url`.
        A device has one download per item: asking again returns the same
        download (retrying it if it failed), and a different quality replaces it.
        Text subtitles aren't part of the file; fetch them from
        `/items/{id}/subtitles/{track}`. A picture subtitle track given as
        `subtitle` is drawn into a converted video.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: integer }
                quality: { type: string, default: original }
                subtitle: { type: string, description: A picture subtitle track id to draw in. }
      responses:
        "200":
          description: The download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    get:
      summary: Downloads for this device
      parameters:
        - { name: device, in: query, schema: { type: string, enum: [all] }, description: "`all` lists every device of the current user." }
        - { name: user, in: query, schema: { type: string, enum: [all] }, description: "`all` lists everyone's (admins only)." }
      responses:
        "200":
          description: Oldest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Download" }
  /downloads/{id}:
    get:
      summary: One download
      parameters: [{ $ref: "#/components/parameters/DownloadID" }]
      responses:
        "200":
          description: The download.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Download" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a download
      description: The server deletes its converted copy once no device needs it. Admins can remove anyone's download.
      parameters: [{ $ref: "#/components/parameters/DownloadID" }]
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
  /downloads/{id}/finished:
    post:
      summary: Say the device has the whole file and its checksum matched
      description: The server keeps a converted copy for a week after every device that asked for it has finished, then cleans it up (the download's state becomes `expired`).
      parameters: [{ $ref: "#/components/parameters/DownloadID" }]
      responses:
        "204": { description: Recorded. }
        "409": { $ref: "#/components/responses/Error" }
  /downloads/{id}/file:
    get:
      summary: The prepared file
      description: |
        Only the device that created the download can fetch it. Supports
        Range requests for resuming. The ETag is the file's SHA-256 in quotes;
        send it as `If-Range` when resuming so a changed file is sent whole
        instead of mixed with the old one. `Repr-Digest` carries the same
        checksum; check it before treating the file as done.
      parameters: [{ $ref: "#/components/parameters/DownloadID" }]
      responses:
        "200": { description: The file. }
        "206": { description: Part of the file. }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: Not ready, or the file changed on the server and is being prepared again. The body has `state`. }
  /sync/progress:
    post:
      summary: Send watch progress recorded while offline
      description: |
        Each event is applied unless the item's progress changed more recently
        (on another device, say), so the latest change wins. Send events in
        batches of up to 1000. Times in the future count as now. A place in an
        audiobook, or in one of its parts, is kept on the book on its whole
        clock, as with PUT /items/{id}/progress.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                events:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [itemId, at]
                    properties:
                      itemId: { type: integer }
                      positionMs: { type: integer }
                      played: { type: boolean }
                      at: { type: integer, description: When it happened, in Unix seconds. }
      responses:
        "200":
          description: How many were applied, and how many were older than what the server had (or for items that are gone).
          content:
            application/json:
              schema:
                type: object
                properties:
                  applied: { type: integer }
                  skipped: { type: integer }

  /integrations:
    get:
      summary: Radarr and Sonarr connections (admins only)
      description: The API key is never sent back; `hasApiKey` says one is saved.
      responses:
        "200":
          description: Each app's connection.
          content:
            application/json:
              schema:
                type: object
                properties:
                  radarr: { $ref: "#/components/schemas/Integration" }
                  sonarr: { $ref: "#/components/schemas/Integration" }
  /integrations/{app}:
    parameters: [{ $ref: "#/components/parameters/App" }]
    put:
      summary: Connect Radarr or Sonarr (admins only)
      description: |
        Checks the app answers before saving. Leave `apiKey` out to keep the
        saved key; that only works for the saved address. Without
        `qualityProfileId` or `rootFolder`, titles added from Matinee get the
        app's first profile and root folder.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationConfig" }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Integration" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { description: The app didn't answer or refused the key. }
    delete:
      summary: Disconnect Radarr or Sonarr (admins only)
      responses:
        "204": { description: Disconnected. }
  /integrations/{app}/test:
    parameters: [{ $ref: "#/components/parameters/App" }]
    post:
      summary: Check a connection without saving it (admins only)
      description: Leave the body out to check the saved connection.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntegrationConfig" }
      responses:
        "200":
          description: It answers. Lists what to pick defaults from.
          content:
            application/json:
              schema:
                type: object
                properties:
                  appName: { type: string }
                  version: { type: string }
                  qualityProfiles: { type: array, items: { $ref: "#/components/schemas/QualityProfile" } }
                  rootFolders:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        freeSpace: { type: integer }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /integrations/podcastindex:
    get:
      summary: The Podcast Index key (admins only)
      description: Podcast Index (podcastindex.org) finds shows to add. Its key and secret are never returned; `hint` is the key's last four characters.
      responses:
        "200":
          description: Whether a key is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodcastIndexConnection" }
    put:
      summary: Set the Podcast Index key (admins only)
      description: The free key and secret from api.podcastindex.org. They're checked with Podcast Index first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, secret]
              properties:
                key: { type: string }
                secret: { type: string }
      responses:
        "200":
          description: Set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PodcastIndexConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      summary: Forget the Podcast Index key (admins only)
      responses:
        "204": { description: Forgotten. }
  /integrations/overseerr:
    get:
      summary: The Overseerr connection (admins only)
      description: Overseerr (or Jellyseerr, which serves the same API) fills the Discover tab. The API key is never returned.
      responses:
        "200":
          description: The connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverseerrConnection" }
    put:
      summary: Connect Overseerr (admins only)
      description: |
        Checks the address and key first. Leave `apiKey` out to keep the saved
        one; it's only kept for the saved address. `requestAs` is the
        Overseerr user that people without an Overseerr account of the same
        name ask as (0 for the API key's owner).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverseerrConfig" }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OverseerrConnection" }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
    delete:
      summary: Disconnect Overseerr (admins only)
      responses:
        "204": { description: Disconnected. The Discover tab goes away. }
  /integrations/overseerr/test:
    post:
      summary: Check an Overseerr connection without saving it (admins only)
      description: Leave the body out to check the saved connection.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OverseerrConfig" }
      responses:
        "200":
          description: It answers. Lists Overseerr's users to pick `requestAs` from.
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  version: { type: string }
                  owner: { $ref: "#/components/schemas/OverseerrUser" }
                  users: { type: array, items: { $ref: "#/components/schemas/OverseerrUser" } }
        "400": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /discover:
    get:
      summary: The Discover tab
      description: |
        Rows of movies and shows from Overseerr: titles like the ones this
        person watched lately ("Because you watched …", leaving out what's in
        a library already), then trending, popular and upcoming titles. Empty
        rows are left out. Lists are kept for up to half an hour. Answers 409
        when Overseerr isn't connected. Not for kids profiles.
      responses:
        "200":
          description: The rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, description: "trending, popular-movies, popular-shows, upcoming-movies, upcoming-shows, or because-{item id}" }
                        title: { type: string, description: In English. Apps may name the lists by id in their own language. }
                        because: { type: string, description: 'On a because-{item id} row, the title watched, so apps can say "Because you watched …" in their own language.' }
                        items: { type: array, items: { $ref: "#/components/schemas/DiscoverTitle" } }
                        more: { type: boolean, description: "The list has more titles; GET /discover/rows/{id} pages through them." }
                  canRequest: { type: boolean, description: This account may ask for titles. }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /discover/rows/{id}:
    get:
      summary: A page of one of the Discover tab's rows
      description: |
        For the See more at the end of a Discover row: the row's titles a
        page at a time, as Overseerr pages them (about 20 a page), up to 25
        pages.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: "A row's id from /discover." }
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
      responses:
        "200":
          description: The page.
          content:
            application/json:
              schema:
                type: object
                properties:
                  row: { type: object, description: "As in /discover's rows; more says there's another page." }
                  page: { type: integer }
                  pages: { type: integer }
                  canRequest: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /discover/search:
    get:
      summary: Find any movie or show through Overseerr
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Matching titles.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/DiscoverTitle" } }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /discover/requests:
    post:
      summary: Ask for a movie or show through Overseerr
      description: |
        Asks for a movie, or every season of a show, as the Overseerr user
        with this person's name (or their account's, for a profile), else as
        the admin's pick. Overseerr's permissions for that user decide
        whether it needs approval. Who may ask follows the server's
        `requests` setting.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, tmdbId]
              properties:
                kind: { type: string, enum: [movie, show] }
                tmdbId: { type: integer }
      responses:
        "201":
          description: Asked for. `status` is requested (waiting for approval) or added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoverTitle" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }

  /requests/options:
    get:
      summary: What this account can ask for
      description: |
        Whether Radarr (`movies`) and Sonarr (`shows`) are connected, and
        whether this account may ask for titles (`canRequest`) and report
        problems (`canReport`). The home network's guest can do neither.
      responses:
        "200":
          description: Options.
          content:
            application/json:
              schema:
                type: object
                properties:
                  movies: { type: boolean }
                  shows: { type: boolean }
                  discover: { type: boolean, description: Overseerr is connected, so there's a Discover tab (see /discover). }
                  canRequest: { type: boolean }
                  autoApprove: { type: boolean, description: What this account asks for is added without waiting for an admin. }
                  canReport: { type: boolean }
                  qualityProfiles:
                    type: object
                    description: By kind (`movie`, `show`).
                    additionalProperties: { type: array, items: { $ref: "#/components/schemas/QualityProfile" } }
                  defaultQualityProfile:
                    type: object
                    additionalProperties: { type: integer }
                  pendingRequests: { type: integer, description: Admins only. }
                  openIssues: { type: integer, description: Admins only. }
  /requests/search:
    get:
      summary: Find a movie or show to ask for
      description: Looks titles up through Radarr or Sonarr. Each says whether it's in a library already, on its way, or asked for.
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [movie, show] } }
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Up to 20 titles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Title" }
        "403": { $ref: "#/components/responses/Error" }
  /requests:
    get:
      summary: Requests
      description: Your own, or with `all` (admins), everyone's. Pending ones first.
      parameters:
        - { name: all, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Requests.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Request" }
    post:
      summary: Ask for a movie or show
      description: |
        Movies are named by `tmdbId`, shows by `tvdbId`, as `/requests/search`
        returns them. Admins' requests, and everyone's when the server's
        `requests` setting is `auto`, are added right away.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [movie, show] }
                tmdbId: { type: integer }
                tvdbId: { type: integer }
                qualityProfileId: { type: integer, description: Leave out for the server's default. }
      responses:
        "201":
          description: Asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { description: Already in a library, on its way, or asked for. }
  /requests/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/RequestID" }]
    post:
      summary: Approve a request (admins only)
      description: Adds the title to Radarr or Sonarr. If that fails the request's state is `failed`, with the reason in `error`; approving again retries.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qualityProfileId: { type: integer }
      responses:
        "200":
          description: The request now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
  /requests/{id}/decline:
    parameters: [{ $ref: "#/components/parameters/RequestID" }]
    post:
      summary: Decline a request (admins only)
      responses:
        "200":
          description: The request now.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Request" }
  /requests/{id}:
    parameters: [{ $ref: "#/components/parameters/RequestID" }]
    delete:
      summary: Take a request off the list
      description: Your own, or anyone's for admins. A title already added stays in Radarr or Sonarr.
      responses:
        "204": { description: Removed. }

  /upcoming:
    get:
      summary: Coming soon
      description: |
        Movie releases and episode airings from Radarr's and Sonarr's
        calendars that are still to come in, soonest first. Answers are kept
        for up to ten minutes.
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200":
          description: What's coming.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [movie, episode] }
                        title: { type: string }
                        year: { type: integer }
                        showTitle: { type: string }
                        season: { type: integer }
                        episode: { type: integer }
                        date: { type: string, format: date-time }
                        release: { type: string, enum: [cinemas, digital, physical, airs] }
                        overview: { type: string }
                        poster: { type: string, description: An image URL on the internet. }
                        tmdbId: { type: integer }
                  unavailable:
                    type: array
                    description: Apps that didn't answer, so the list may be missing some.
                    items: { type: string }

  /items/{id}/quality:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    get:
      summary: The quality profile of a movie or show (admins only)
      description: For a season or episode, the show's. 404 when Radarr or Sonarr doesn't have the title.
      responses:
        "200":
          description: The profile, and the ones to choose from.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quality" }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Change the quality profile of a movie or show (admins only)
      description: Then searches for copies that match it, unless `search` is false.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [qualityProfileId]
              properties:
                qualityProfileId: { type: integer }
                search: { type: boolean, default: true }
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Quality" }
  /items/{id}/issues:
    parameters: [{ $ref: "#/components/parameters/ID" }]
    post:
      summary: Report a problem with an item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [video, audio, subtitles, wrong, other], description: "`wrong` is the wrong movie or episode." }
                note: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: Reported.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Issue" }
  /issues:
    get:
      summary: Reported problems
      description: Your own, or with `all` (admins), everyone's. Open ones first.
      parameters:
        - { name: all, in: query, schema: { type: boolean } }
      responses:
        "200":
          description: Issues.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Issue" }
  /issues/{id}/resolve:
    parameters: [{ $ref: "#/components/parameters/IssueID" }]
    post:
      summary: Close an issue (admins only)
      responses:
        "204": { description: Closed. }
  /issues/{id}/replace:
    parameters: [{ $ref: "#/components/parameters/IssueID" }]
    post:
      summary: Replace the file (admins only)
      description: |
        Deletes the movie's or episode's file in Radarr or Sonarr and has it
        search for another copy, then closes the issue. The next scan picks
        the new file up.
      responses:
        "204": { description: Deleted, and searching. }
        "502": { $ref: "#/components/responses/Error" }

  /library-kinds:
    get:
      summary: The kinds of library that can be added (admins only)
      description: |
        Movies, TV and music, and the kinds that running plugins add. A
        plugin's kind has its own label and description; clients label the
        built-in ones themselves.
      responses:
        "200":
          description: Library kinds.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name]
                  properties:
                    name: { type: string, examples: [movies, arcade] }
                    label: { type: string, examples: [Arcade] }
                    description: { type: string }
                    plugin: { type: string, description: The plugin that adds it. }
  /plugins:
    get:
      summary: The installed plugins (admins only)
      description: See docs/plugins.md.
      responses:
        "200":
          description: Plugins, by name.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Plugin" } }
    post:
      summary: Install or update a plugin (admins only)
      description: |
        Send a `.matinee-plugin` file as the body, or JSON with the `url` to
        download it from. A new plugin is installed turned off. An update
        keeps the plugin on, unless it asks to reach hosts the admin didn't
        allow yet.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: The plugin as installed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "400": { $ref: "#/components/responses/Error" }
  /plugins/catalog:
    get:
      summary: The official plugins (admins only)
      description: Fetched from the Matinee website and kept for an hour.
      responses:
        "200":
          description: Official plugins.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, name, description, version, url]
                  properties:
                    id: { type: string }
                    name: { type: string }
                    description: { type: string }
                    version: { type: string }
                    url: { type: string, format: uri, description: Where to download it; pass it to POST /plugins. }
                    homepage: { type: string, format: uri }
                    installed: { type: string, description: The version installed on this server, if any. }
        "502": { $ref: "#/components/responses/Error" }
  /plugins/{plugin}:
    parameters: [{ $ref: "#/components/parameters/PluginID" }]
    put:
      summary: Turn a plugin on or off, or change its settings (admins only)
      description: |
        Turning a plugin on allows the network hosts it lists. A secret
        setting sent back as shown (`••••••`) keeps its value.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
                config: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: The plugin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Plugin" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Remove a plugin (admins only)
      description: |
        Deletes the plugin, its data, and what its player kept for everyone.
        Libraries of its kinds stay but aren't scanned.
      responses:
        "204": { description: Removed. }
        "404": { $ref: "#/components/responses/Error" }
  /plugins/{plugin}/files/{path}:
    parameters:
      - { $ref: "#/components/parameters/PluginID" }
      - { name: path, in: path, required: true, schema: { type: string }, description: A file under a player's folder, or the icon. }
    get:
      summary: A running plugin's player files and its icon
      description: |
        No sign-in needed. Served with a `Content-Security-Policy: sandbox`
        header, so a player page never runs as this site; the web player
        loads it in a sandboxed frame and talks to it with postMessage
        (docs/plugins.md).
      security: []
      responses:
        "200": { description: The file. }
        "404": { description: No such file. }
  /plugins/{plugin}/storage:
    parameters: [{ $ref: "#/components/parameters/PluginID" }]
    get:
      summary: What a plugin's player keeps for the signed-in person
      parameters:
        - { name: prefix, in: query, schema: { type: string }, description: Only keys that start with this. }
      responses:
        "200":
          description: Keys, newest first, and how much is used of the limit.
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        size: { type: integer }
                        updatedAt: { type: integer, description: Unix milliseconds. }
                  used: { type: integer }
                  limit: { type: integer }
  /plugins/{plugin}/storage/{key}:
    parameters:
      - { $ref: "#/components/parameters/PluginID" }
      - { name: key, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-][A-Za-z0-9._/-]{0,199}$" } }
    get:
      summary: One thing a plugin's player kept, such as a saved game
      responses:
        "200":
          description: The bytes as saved.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
    put:
      summary: Keep something for the signed-in person
      description: Up to 32 MB each, and 512 MB per person for each plugin.
      requestBody:
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "204": { description: Saved. }
        "413": { $ref: "#/components/responses/Error" }
    delete:
      summary: Forget something a player kept
      responses:
        "204": { description: Gone. }
  /plugins/{plugin}/libraries/{id}/file:
    parameters:
      - { $ref: "#/components/parameters/PluginID" }
      - { $ref: "#/components/parameters/ID" }
      - { name: path, in: query, required: true, schema: { type: string }, description: The file's path inside one of the library's folders. }
    get:
      summary: Another file of a plugin's library, for its player
      description: |
        Such as the parent set a game needs. Only files the library kind
        indexes, in libraries of the plugin's kinds that the person can see.
      responses:
        "200":
          description: The file.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Error" }
  /players:
    get:
      summary: The players running plugins have
      description: |
        The web player plays an item whose kind is listed here with that
        plugin's page, `/plugins/{plugin}/files/{entry}`.
      responses:
        "200":
          description: Players.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [plugin, itemKinds, entry]
                  properties:
                    plugin: { type: string }
                    itemKinds: { type: array, items: { type: string }, examples: [[game]] }
                    entry: { type: string, examples: [player/index.html] }

  /clients/{client}:
    put:
      summary: Say hello and what this player plays
      description: |
        Every open web player and app reports here when it opens, whenever
        what it plays changes (play, pause, seek, a new item), and about
        every 10 seconds while playing, so people and home automation can
        see what's on and send it commands. `client` is an id the player
        made up once and keeps, such as a UUID. Works for the home guest.
        Then ask for commands with `GET /clients/{client}/commands`.
      parameters: [{ $ref: "#/components/parameters/ClientID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClientReport" }
      responses:
        "200":
          description: Noted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pollSeconds: { type: integer, description: The longest wait to ask for in GET /clients/{client}/commands. }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
    delete:
      summary: Say this player closed
      parameters: [{ $ref: "#/components/parameters/ClientID" }]
      responses:
        "204": { description: It shows as offline. }
    get:
      summary: One client (grown-ups who signed in)
      parameters: [{ $ref: "#/components/parameters/ClientID" }]
      responses:
        "200":
          description: The client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "404": { $ref: "#/components/responses/Error" }
  /clients/{client}/commands:
    get:
      summary: Wait for commands for this player
      description: |
        Answers as soon as there's a command, or with none after `wait`
        seconds (at most 30). Ask again right away. A player that stops
        asking for 45 seconds shows as offline. 404 means the server
        doesn't know this player (it restarted): say hello again. When the
        server starts shutting down, every waiting request answers at once
        with `restarting: true`, so a player can tell its viewer and pick up
        where it was once the server is back (see `/health`).
      parameters:
        - { $ref: "#/components/parameters/ClientID" }
        - { name: wait, in: query, schema: { type: integer, minimum: 0, maximum: 30 } }
      responses:
        "200":
          description: Commands, oldest first; do each in turn.
          content:
            application/json:
              schema:
                type: object
                properties:
                  commands: { type: array, items: { $ref: "#/components/schemas/Command" } }
                  restarting: { type: boolean }
        "404": { $ref: "#/components/responses/Error" }
    post:
      summary: Ask a player to do something
      description: |
        Admins can control every player; anyone else who signed in, their
        own account's. Kids profiles can't. A player only takes the
        commands it lists in `commands`.
      parameters: [{ $ref: "#/components/parameters/ClientID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Command" }
      responses:
        "202":
          description: Sent; the player will report the change.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Command" }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /clients:
    get:
      summary: Open players (grown-ups who signed in)
      description: Admins see every player; anyone else, their own account's. Online ones first.
      responses:
        "200":
          description: Clients.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Client" } }
  /events:
    get:
      summary: Follow what happens, live (admins only)
      description: |
        Server-sent events (`text/event-stream`). Each event's name is its
        `type` and its data is an Event. The first is `snapshot`, with every
        client in `clients`; after that come `client.updated`,
        `client.removed`, `playback.started`, `playback.paused`,
        `playback.resumed`, `playback.stopped`, `item.added` and
        `library.scanned`. A follower that falls far behind is cut off;
        reconnect and start from the new snapshot.
      responses:
        "200":
          description: The feed.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    ID:
      { name: id, in: path, required: true, schema: { type: integer } }
    DownloadID:
      { name: id, in: path, required: true, schema: { type: string } }
    App:
      { name: app, in: path, required: true, schema: { type: string, enum: [radarr, sonarr] } }
    RequestID:
      { name: id, in: path, required: true, schema: { type: string } }
    IssueID:
      { name: id, in: path, required: true, schema: { type: string } }
    ClientID:
      { name: client, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9._-]{8,64}$" }, description: The id the player made up for itself. }
    PluginID:
      { name: plugin, in: path, required: true, schema: { type: string }, examples: { arcade: { value: arcade } } }
    PlaylistID:
      { name: id, in: path, required: true, schema: { type: string } }
    UserCode:
      { name: code, in: path, required: true, schema: { type: string }, description: "The code as typed; case, dashes and spaces don't matter." }
    Filter:
      name: filter
      in: query
      style: form
      explode: true
      description: Each ItemFilter field is its own query parameter; repeat a parameter for several values.
      schema: { $ref: "#/components/schemas/ItemFilter" }
  responses:
    Error:
      description: Something was wrong with the request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SignedIn:
      description: Signed in. Browsers also get a session cookie.
      content:
        application/json:
          schema:
            type: object
            properties:
              user: { $ref: "#/components/schemas/User" }
              token: { type: string }
    PlaylistWithSongs:
      description: The playlist and its songs.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PlaylistWithSongs" }
    Items:
      description: Items.
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Item" }
  schemas:
    PathChange:
      type: object
      description: Turns the start of the other server's paths into Matinee's.
      properties:
        from: { type: string, example: /data }
        to: { type: string, example: /mnt/media }
        files: { type: integer, description: "In suggestions: how many files it matches." }
    ImportRequest:
      type: object
      properties:
        path: { type: string, description: "The other server's data folder, a folder above it, or its database, on this server. Empty uses the uploaded database." }
        changes: { type: array, items: { $ref: "#/components/schemas/PathChange" } }
        accounts: { type: object, additionalProperties: { type: integer }, description: "For running: the other server's account ids mapped to Matinee account or profile ids. Accounts left out are skipped." }
        watched: { type: boolean, description: Bring over watched marks and places to resume from. }
        collections: { type: boolean, description: Bring over collections, as shared collections. }
        posters: { type: boolean, description: Bring over posters someone uploaded there. }
        ratings: { type: boolean, description: "Bring over each person's ratings, as their own ratings here." }
    ImportResult:
      type: object
      properties:
        watched: { type: integer }
        inProgress: { type: integer }
        kept: { type: integer, description: Left alone because they were watched more recently on Matinee. }
        collections: { type: integer }
        collectionItems: { type: integer }
        posters: { type: integer }
        ratings: { type: integer, description: Ratings given or changed. }
    ItemFilter:
      description: >
        Picks titles by their metadata. The same field names are used as query
        parameters and as JSON, so a filter can be saved as is. Within a field
        any value matches, except tag and person, where every value must.
        Relative fields (addedWithin, releasedWithin) count from the day the
        filter runs.
      type: object
      properties:
        library: { type: array, items: { type: integer }, description: Library ids; none means every library. }
        kind: { type: array, items: { type: string, enum: [movie, show, season, episode, artist, album, track, author, book, part, podcast, podcastEpisode] }, description: Without it, libraries' top level is listed. }
        q: { type: string, description: Words in the title. }
        genre: { type: array, items: { type: string } }
        notGenre: { type: array, items: { type: string } }
        yearMin: { type: integer }
        yearMax: { type: integer }
        releasedAfter: { type: string, format: date, description: Shows use their first air date; titles without a date count as released on January 1st of their year. }
        releasedBefore: { type: string, format: date }
        releasedWithin: { type: integer, description: Released in the last this many days. }
        addedAfter: { type: string, format: date, description: A show counts as added when its newest episode was. }
        addedBefore: { type: string, format: date }
        addedWithin: { type: integer, description: Added in the last this many days. }
        ratingMin: { type: number, description: 0 to 10. }
        ratingMax: { type: number }
        runtimeMin: { type: integer, description: Minutes; a show's runtime is its average episode's, an album's its total. }
        runtimeMax: { type: integer }
        watched:
          type: string
          enum: [unwatched, inProgress, watched, notStarted, started]
          description: For the signed-in person. unwatched has something left to play; watched has everything played; started has anything played or begun.
        tag: { type: array, items: { type: string }, description: Media tags such as 4k, hdr or atmos (see Item.mediaTags); all must match. }
        notTag: { type: array, items: { type: string } }
        person: { type: array, items: { type: integer }, description: TMDB person ids credited in any role, including episodes; all must match. }
        director: { type: array, items: { type: integer }, description: Directed or created the title or one of its episodes. }
        studio: { type: array, items: { type: string }, description: Studios, and networks for shows. }
        country: { type: array, items: { type: string } }
        language: { type: array, items: { type: string }, description: Original language, e.g. Japanese. }
        certification: { type: array, items: { type: string }, description: e.g. PG-13 or TV-MA. }
        collection: { type: array, items: { type: integer }, description: TMDB collection ids. }
        watchList: { type: boolean, description: Only titles on the signed-in person's watch list. }
        series: { type: array, items: { type: string }, description: Books in these series. }
        narrator: { type: array, items: { type: string }, description: Books any of these people narrate. }
        sort: { type: string, enum: [title, added, released, year, rating, myRating, runtime, lastPlayed, series], default: title, description: "series is a book's place in its series; myRating is the person's own rating." }
        order: { type: string, enum: [asc, desc], description: Title and runtime run low to high by default, the others high to low. Titles missing the field go last. }
        limit: { type: integer }
    FilterValue:
      type: object
      properties:
        value: { type: string }
        label: { type: string, description: A name for values that are ids, such as collections. }
        count: { type: integer }
    FilterPerson:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        hasPhoto: { type: boolean, description: "GET /people/{id}/image has a photo." }
        count: { type: integer, description: Titles they're credited in. }
    FilterOptions:
      type: object
      properties:
        genres: { type: array, items: { $ref: "#/components/schemas/FilterValue" } }
        tags: { type: array, items: { $ref: "#/components/schemas/FilterValue" } }
        studios: { type: array, items: { $ref: "#/components/schemas/FilterValue" } }
        countries: { type: array, items: { $ref: "#/components/schemas/FilterValue" } }
        languages: { type: array, items: { $ref: "#/components/schemas/FilterValue" } }
        certifications: { type: array, items: { $ref: "#/components/schemas/FilterValue" } }
        collections: { type: array, items: { $ref: "#/components/schemas/FilterValue" } }
        directors: { type: array, items: { $ref: "#/components/schemas/FilterPerson" }, description: The most credited 30. }
        cast: { type: array, items: { $ref: "#/components/schemas/FilterPerson" }, description: The most credited 30. }
        yearMin: { type: integer }
        yearMax: { type: integer }
        hasRatings: { type: boolean }
        hasRuntimes: { type: boolean }
        hasReleased: { type: boolean }
    Collection:
      type: object
      description: |
        A smart collection is a saved library filter and fills itself; a
        manual one is kept by hand. A new server starts with three shared
        smart ones (`starter`): recent, unwatched and tonight.
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [smart, manual] }
        ownerId: { type: integer, description: Who made it; absent on a shared collection. }
        shared: { type: boolean }
        filter: { $ref: "#/components/schemas/ItemFilter" }
        sort:
          type: string
          enum: [title, added, released, year, rating, runtime, lastPlayed, shuffle]
          description: |
            Absent for the collection's own order: its filter's, or the order
            titles were added in. `shuffle` is a different order each day.
            Manual collections can't sort by released or lastPlayed.
        order: { type: string, enum: [asc, desc] }
        pinHome: { type: boolean, description: Shown as a row on Home. }
        pinLibrary: { type: integer, description: Shown as a row on this library's page. }
        starter: { type: string, examples: [tonight] }
        createdAt: { type: integer, description: Unix milliseconds }
        updatedAt: { type: integer, description: Unix milliseconds }
        count: { type: integer, description: How many titles it has in all. }
        items: { type: array, items: { $ref: "#/components/schemas/Item" } }
        canEdit: { type: boolean }
        contains: { type: boolean, description: Only with `?item=`, on manual collections. }
    CollectionInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        kind: { type: string, enum: [smart, manual], description: Required when making one. }
        filter: { $ref: "#/components/schemas/ItemFilter" }
        sort: { type: string }
        order: { type: string, enum: [asc, desc] }
        pinHome: { type: boolean }
        pinLibrary: { type: [integer, "null"] }
        shared: { type: boolean, description: Only when making one, and only for admins. }
    BoxSet:
      type: object
      properties:
        id: { type: integer, description: TMDB collection id }
        name: { type: string }
        count: { type: integer }
        itemIds: { type: array, items: { type: integer }, description: Its titles in the library, oldest first. }
    Error:
      type: object
      properties:
        error: { type: string, description: In English. }
        code: { type: string, example: no_such_theme, description: The message's key in the errors catalog. }
        params:
          type: object
          additionalProperties: { type: string }
          description: "For a message that names something, such as {{title}} is already on its way: the names, to put into the catalog's message."
    ServerInfo:
      type: object
      properties:
        uuid: { type: string, description: "This server's own id, which never changes. Home Assistant tells servers apart by it." }
        product: { type: string, const: matinee }
        version: { type: string }
        apiVersion: { type: integer }
        needsSetup: { type: boolean }
        name: { type: string, description: What the apps call this server. }
        homeAccess:
          type: boolean
          description: This device is on the server's home network and may browse and play without signing in.
        remoteURL:
          type: string
          description: |
            Where the apps reach this server away from home: the address set
            with `MATINEE_PUBLIC_URL`, or the one remote access set up
            (`https://<public IP>:<port>`, with a certificate browsers and
            phones trust). Empty when there is none. Apps should remember it
            while at home and try it when the home address doesn't answer.
            If the public IP changes while they're away, they look the
            server up at `lookupURL`.
        remoteReady:
          type: boolean
          description: |
            `remoteURL` is known to work away from home: the public URL
            leads to a public address, or remote access passed its outside
            check. False when there's no such address, or when `remoteURL`
            is only a public URL that leads home (it may still work over a
            VPN).
        serverId:
          type: string
          description: This server's id with the connect service (docs/connect.md). Empty when remote access isn't working or the service is off.
        lookupURL:
          type: string
          description: |
            Where the apps find this server's current outside addresses when
            `remoteURL` stops answering: `GET` it for `{"id", "urls",
            "updated"}`, then try each URL. The service only knows addresses;
            everything else goes straight to the server. Empty when there's
            none.
        serverProof:
          type: boolean
          description: |
            `POST /server/proof` works here. An app that saw this asks a
            looked-up address for proof before sending its token there.
    QualityStep:
      type: object
      properties:
        id: { type: string, example: 720p }
        label: { type: string, example: 720p }
        width: { type: integer, description: The widest the picture gets. }
        height: { type: integer }
        videoBps: { type: integer, description: Peak video bitrate, bits per second. }
        audioBps: { type: integer, description: Audio bitrate, bits per second. }
    Settings:
      type: object
      properties:
        requireSignInAtHome:
          type: boolean
          description: Devices on the home network have to sign in too. Off by default.
        requests:
          type: string
          enum: [off, approve, auto]
          description: |
            Who may add titles through Radarr and Sonarr besides admins: nobody
            (`off`), anyone, with an admin approving (`approve`, the default),
            or anyone, right away (`auto`). Settings left out of a `PUT` stay
            as they are.
        remoteTrailers:
          type: boolean
          description: Offer TMDB's YouTube trailers along with trailer files. On by default.
        holidayRows:
          type: boolean
          description: Show a row of titles for a holiday on Home in the weeks before it. On by default.
        adaptiveQuality:
          type: boolean
          description: Transcodes become adaptive streams of qualitySteps, and people can pick a quality in the player. Off by default.
        qualitySteps:
          type: array
          items: { type: string, enum: ["1080p", "720p", "480p", "360p"] }
          description: The quality steps adaptive streams use. All of them by default.
        remoteQualityCap:
          type: string
          enum: ["", "1080p", "720p", "480p", "360p"]
          description: The best quality step a stream away from home may use, adaptive quality on or off. Empty for no cap (the default).
        theme:
          type: string
          description: The theme everyone sees until they pick their own. `matinee` by default.
        themeProblems:
          type: array
          readOnly: true
          items: { type: string }
          description: Theme files in `<data>/themes` that couldn't be loaded, and why. Ignored in a `PUT`.
        remoteAccess:
          type: boolean
          description: |
            Open a port on the home router (UPnP or NAT-PMP) and get a Let's
            Encrypt certificate for its public IP address, so the apps reach
            this server away from home. Off by default.
        remoteForwardedPort:
          type: integer
          enum: [0, 443, 80]
          description: |
            The router port an admin forwarded to the remote access port by
            hand, for routers that won't open one when asked. 0 (the
            default) asks the router.
        remote:
          type: object
          readOnly: true
          description: How remote access is doing. Missing when the server can't offer it (`MATINEE_REMOTE_ADDR=off`). Ignored in a `PUT`.
          properties:
            enabled: { type: boolean }
            state: { type: string, enum: [off, working, ready, failed] }
            url: { type: string, description: The address the apps use away from home, once ready. }
            router: { type: string, description: How the port was opened, `UPnP` or `NAT-PMP`. }
            publicIP: { type: string }
            problem: { type: string, description: What stands in the way, for people to read. }
            sharedAddress:
              type: boolean
              description: The router has no public address of its own (the internet provider shares one, or another router sits in front), so a direct connection can't work.
            forwardedPort: { type: integer, description: The router port forwarded by hand, when one is. }
            listenPort: { type: integer, description: The server's remote access port, where a forward made by hand goes. }
            findable: { type: boolean, description: The connect service knows the current address, so apps away from home find the server after it changes. }
            connect:
              type: object
              description: The Matinee Connect subscription that pays for being findable. Missing when the server uses a service that needs none.
              properties:
                state: { type: string, enum: [none, checkout, active, ended], description: "`checkout`: a checkout is open, waiting for payment." }
                until: { type: string, format: date-time, description: Paid up until, renewals included as they're paid. }
                checkout: { type: string, description: The open checkout's page. }
                problem: { type: string }
            certificateExpires: { type: string, format: date-time }
            checkedAt: { type: string, format: date-time }
        publicURL:
          type: string
          readOnly: true
          description: The address set with `MATINEE_PUBLIC_URL`, which apps use away from home. Ignored in a `PUT`.
        publicURLHomeOnly:
          type: boolean
          readOnly: true
          description: True when `publicURL`'s name doesn't resolve to a public address, so it only works at home and remote access is offered as if it weren't set.
        libraryWatch:
          type: string
          enum: [auto, poll, off]
          description: >
            How library folders are watched for new files: change notifications
            on local disks and a quick check every `watchPollSeconds` on network
            shares (`auto`, the default), the quick check everywhere (`poll`), or
            only the full rescan (`off`).
        watchPollSeconds:
          type: integer
          readOnly: true
          description: How often polled folders are checked (MATINEE_WATCH_POLL_INTERVAL). Ignored in a `PUT`.
        scanIntervalSeconds:
          type: integer
          readOnly: true
          description: How often every library is rescanned in full, 0 for never (MATINEE_SCAN_INTERVAL). Ignored in a `PUT`.
        tmdb:
          type: object
          readOnly: true
          description: Where the TMDB key in use comes from. The key itself is never sent. Ignored in a `PUT`.
          properties:
            source:
              type: string
              enum: [settings, environment, built-in, none]
              description: Saved with `tmdbKey`, from `MATINEE_TMDB_KEY`, built into the server, or no key at all.
            hint: { type: string, description: The key's last four characters. }
        tmdbKey:
          type: string
          writeOnly: true
          description: |
            A TMDB API key or API Read Access Token to use from now on. It's
            checked with TMDB first (400 when TMDB turns it down, 502 when
            TMDB can't be reached), then replaces `MATINEE_TMDB_KEY` and any
            built-in key, and every library is scanned to fill in what's
            missing. An empty string removes the saved key and goes back to
            those.
        hardwareAcceleration:
          type: string
          enum: [auto, off, nvenc, vaapi, qsv, videotoolbox, amf, v4l2m2m]
          description: |
            What video transcodes run on: the best accelerator that passed
            its test at startup (`auto`, the default), the CPU (`off`), or one
            accelerator. A chosen accelerator that isn't available here means
            the CPU. A transcode that fails on the GPU starts again on the CPU.
        hardware:
          type: object
          readOnly: true
          description: Which accelerator is in use and which ones work on this server. Ignored in a `PUT`.
          properties:
            active:
              description: What new transcodes use; null means the CPU.
              oneOf: [{ $ref: '#/components/schemas/Accelerator' }, { type: 'null' }]
            available:
              type: array
              items: { $ref: '#/components/schemas/Accelerator' }
            detecting: { type: boolean, description: The startup tests are still running. }
            problem: { type: string, description: "When no accelerator works: why a GPU the server can see couldn't be used, such as a missing permission." }
    PlaybackPrefs:
      type: object
      properties:
        autoPlay: { type: boolean, description: Offer the next episode with a countdown. }
        binge: { type: boolean, description: Skip the countdown and start the next episode right away. }
    MyLanguage:
      type: object
      required: [language]
      properties:
        language: { type: string, example: pt-BR, description: 'A language code from GET /languages, or "" to follow each device.' }
    Language:
      type: object
      required: [code, name, dir, status]
      properties:
        code: { type: string, example: zh-Hant, description: A BCP 47 tag. }
        name: { type: string, example: 繁體中文, description: The language's name in itself. }
        dir: { type: string, enum: [ltr, rtl] }
        status: { type: string, enum: [source, machine, partial, reviewed, community], description: How the text was translated. }
    MyTheme:
      type: object
      required: [theme]
      properties:
        theme: { type: string, example: sci-fi, description: 'A theme id, or "" for the server''s default.' }
    Theme:
      type: object
      required: [id, name, scheme, fonts, colors, builtIn]
      properties:
        id: { type: string, example: sci-fi }
        name: { type: string, example: Sci-fi }
        description: { type: string }
        author: { type: string }
        scheme: { type: string, enum: [dark, light], description: What the system's own controls should match. }
        builtIn: { type: boolean, description: Ships with Matinee, rather than a file an admin added. }
        fonts:
          type: object
          properties:
            display: { type: string, enum: [fraunces, inter, orbitron], description: Titles and headings. }
            body: { type: string, enum: [inter] }
        colors:
          type: object
          description: Every colour as `#rrggbb` or `rgba(r,g,b,a)`. See docs/themes.md for what each is for.
          additionalProperties: { type: string }
          example: { ink: "#04070e", surface: "#0a1020", raised: "#111a2e", line: "#1f2d48", text: "#e4f6ff", muted: "#8cb0c6", faint: "#5b7489", accent: "#22e5ff", accentStrong: "#7cf1ff", onAccent: "#03121a", danger: "#ff5c7a", glow: "rgba(34,229,255,0.6)", glass: "rgba(34,229,255,0.12)", glassFocused: "rgba(34,229,255,0.28)", scrim: "#000000", track: "rgba(228,246,255,0.25)", shade: "rgba(0,0,0,0.55)", veil: "rgba(4,7,14,0.35)" }
    Trailer:
      type: object
      required: [id, name, source]
      properties:
        id: { type: string, example: local-0 }
        name: { type: string, example: Official Trailer }
        source:
          type: string
          enum: [local, youtube]
          description: Local trailers play through `/items/{id}/trailers/{trailer}/file` or `/hls`; YouTube ones on YouTube.
        mimeType: { type: string, description: Local trailers only. }
        container: { type: string, description: Local trailers only, as the first name ffprobe gives (e.g. mov or matroska). }
        videoCodec: { type: string, description: Local trailers only. }
        audioCodec: { type: string, description: Local trailers only. }
        durationMs: { type: integer, description: Local trailers only. }
        key: { type: string, description: The YouTube video id. }
        url: { type: string, description: The YouTube page. }
    Accelerator:
      type: object
      properties:
        id: { type: string, description: "nvenc, vaapi, qsv, videotoolbox, amf or v4l2m2m" }
        name: { type: string, description: "Such as VAAPI." }
        device: { type: string, description: "The GPU's render node, such as /dev/dri/renderD128 (VAAPI, and Quick Sync on Linux)." }
        detail: { type: string, description: "The GPU, when its driver says, such as AMD Radeon RX 7900 XTX." }
        decode: { type: boolean, description: "The GPU decodes too, not only encodes." }
    Integration:
      type: object
      properties:
        connected: { type: boolean }
        url: { type: string }
        hasApiKey: { type: boolean }
        qualityProfileId: { type: integer, description: What titles added from Matinee get by default. }
        rootFolder: { type: string }
    IntegrationConfig:
      type: object
      properties:
        url: { type: string, description: "Such as http://radarr:7878. Without a scheme, http is assumed." }
        apiKey: { type: string }
        qualityProfileId: { type: integer }
        rootFolder: { type: string }
    OverseerrConfig:
      type: object
      properties:
        url: { type: string, description: "Such as http://overseerr:5055. Without a scheme, http is assumed." }
        apiKey: { type: string }
        requestAs: { type: integer, description: "The Overseerr user people without an Overseerr account ask as; 0 for the API key's owner." }
    OverseerrConnection:
      type: object
      properties:
        connected: { type: boolean }
        url: { type: string }
        hasApiKey: { type: boolean }
        requestAs: { type: integer }
    OverseerrUser:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    DiscoverTitle:
      type: object
      properties:
        kind: { type: string, enum: [movie, show] }
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster: { type: string, description: An image URL on the internet. }
        backdrop: { type: string, description: An image URL on the internet. }
        rating: { type: number, description: "TMDB's rating, out of 10." }
        status:
          type: string
          enum: [available, added, requested]
          description: "In a library (see itemId), on its way, or waiting for approval in Overseerr. Left out when nobody asked for it."
        itemId: { type: integer, description: The library item, when available. }
    QualityProfile:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Quality:
      type: object
      properties:
        app: { type: string, enum: [radarr, sonarr] }
        qualityProfileId: { type: integer }
        qualityProfiles: { type: array, items: { $ref: "#/components/schemas/QualityProfile" } }
    Title:
      type: object
      properties:
        kind: { type: string, enum: [movie, show] }
        tmdbId: { type: integer }
        tvdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        poster: { type: string, description: An image URL on the internet. }
        status:
          type: string
          enum: [available, added, requested]
          description: Missing when nobody has asked for it yet.
        itemId: { type: integer, description: When available. }
        requestId: { type: string, description: When requested. }
    Request:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [movie, show] }
        tmdbId: { type: integer }
        tvdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        poster: { type: string }
        qualityProfileId: { type: integer }
        state: { type: string, enum: [pending, approved, declined, failed] }
        error: { type: string }
        userId: { type: integer }
        username: { type: string }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        itemId: { type: integer, description: Set once an approved title is in a library. }
    Issue:
      type: object
      properties:
        id: { type: string }
        itemId: { type: integer }
        item: { $ref: "#/components/schemas/Item" }
        kind: { type: string, enum: [video, audio, subtitles, wrong, other] }
        note: { type: string }
        resolved: { type: boolean }
        resolution: { type: string, description: "`replaced`, or empty when an admin closed it." }
        replaceable: { type: boolean, description: An admin can have the file replaced. }
        userId: { type: integer }
        username: { type: string }
        createdAt: { type: integer }
        resolvedAt: { type: integer }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, minLength: 8 }
    DeviceInfo:
      type: object
      properties:
        deviceName: { type: string, maxLength: 80, example: "Mike's iPhone" }
        platform: { type: string, maxLength: 20, examples: [ios, android, tvos, androidtv, web] }
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string, description: "A profile's name, for profiles." }
        isAdmin: { type: boolean }
        guest:
          type: boolean
          description: The shared account of a device at home that hasn't signed in, or one of its profiles.
        accountId: { type: integer, description: "The account a profile belongs to; absent for accounts." }
        kidsLevel:
          type: integer
          description: |
            For kids profiles, the oldest age rating they see: 1 little kids
            (G, TV-Y, TV-G), 2 kids (PG, TV-Y7, TV-PG), 3 teens (PG-13,
            TV-14). Kids profiles can't make requests, report problems, see
            coming soon or manage devices.
        avatar: { type: string, description: "A colour name: coral, amber, lime, teal, sky, violet, pink or slate." }
        hasPin: { type: boolean }
    ProfileChoice:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        avatar: { type: string }
        kidsLevel: { type: integer }
        hasPin: { type: boolean }
        account: { type: boolean, description: The account itself rather than one of its profiles. }
    Profile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            libraries:
              type: object
              additionalProperties: { type: string, enum: [all, rated] }
              description: |
                Library ids a kids profile sees: everything in them, or only
                titles rated up to its level. Others are hidden.
    ProfileChanges:
      type: object
      properties:
        accountId: { type: integer, description: Only when adding a profile. }
        name: { type: string }
        avatar: { type: string }
        kidsLevel: { type: integer, minimum: 0, maximum: 3 }
        pin: { type: string, description: 'Four digits; "" removes the PIN.' }
        libraries:
          type: object
          additionalProperties: { type: string, enum: [all, rated] }
    Device:
      type: object
      properties:
        id: { type: string }
        deviceName: { type: string }
        platform: { type: string }
        createdAt: { type: integer, description: Unix seconds. }
        lastSeenAt: { type: integer, description: Unix seconds, updated every few minutes. }
        current: { type: boolean, description: The device making this request. }
    Library:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kind: { type: string, examples: [movies, tv, music] }
        paths: { type: array, items: { type: string } }
        scanning: { type: boolean }
        titles: { type: integer, description: "Movies, shows or artists; with ?counts=1, for admins." }
        files: { type: integer, description: "Playable files; with ?counts=1, for admins." }
        watch:
          type: array
          description: How each folder is watched for new files. Empty just after the server starts.
          items:
            type: object
            properties:
              path: { type: string }
              method: { type: string, enum: [events, polling, off] }
              reason: { type: string, description: 'Why a folder is polled, such as "network share (cifs)".' }
    BookGroup:
      type: object
      description: A series or a narrator of audiobooks.
      properties:
        name: { type: string }
        books: { type: integer, description: How many books. }
        itemIds: { type: array, items: { type: integer }, description: Up to four of its books, first in reading order, for artwork. }
    Playlist:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        count: { type: integer, description: Songs the person may play. }
        durationMs: { type: integer }
        albumIds: { type: array, items: { type: integer }, description: "Up to four different albums on it, for a cover." }
        createdAt: { type: integer, description: Milliseconds. }
        updatedAt: { type: integer, description: Milliseconds. }
    PlaylistWithSongs:
      allOf:
        - $ref: "#/components/schemas/Playlist"
        - type: object
          properties:
            entries:
              type: array
              description: The songs in order. Each is an Item with its place's own entryId, since a song can be on a playlist twice.
              items:
                allOf:
                  - $ref: "#/components/schemas/Item"
                  - type: object
                    properties:
                      entryId: { type: string }
    DirectoryShow:
      type: object
      description: A podcast in Podcast Index.
      properties:
        indexId: { type: integer }
        title: { type: string }
        author: { type: string }
        description: { type: string }
        image: { type: string, description: An image address on the internet. }
        feedUrl: { type: string, description: Add it with POST /podcasts. }
        link: { type: string }
        language: { type: string }
        categories: { type: array, items: { type: string } }
        episodes: { type: integer }
        itemId: { type: integer, description: The show's id when a library has it already. }
    PodcastIndexConnection:
      type: object
      properties:
        connected: { type: boolean }
        hint: { type: string }
    Item:
      type: object
      description: Anything browsable. Fields without a value are left out.
      properties:
        id: { type: integer }
        libraryId: { type: integer }
        parentId: { type: integer }
        kind: { type: string, examples: [movie, show, season, episode, artist, album, track, author, book, part, podcast, podcastEpisode] }
        title: { type: string }
        year: { type: integer }
        index: { type: integer, description: Season, episode or track number. }
        disc: { type: integer }
        durationMs: { type: integer }
        container: { type: string }
        videoCodec: { type: string }
        audioCodec: { type: string }
        width: { type: integer }
        height: { type: integer }
        addedAt: { type: integer, description: Unix seconds. }
        playable: { type: boolean }
        childCount: { type: integer }
        positionMs: { type: integer }
        played: { type: boolean }
        overview: { type: string }
        rating: { type: number }
        myRating: { type: integer, minimum: 1, maximum: 10, description: "The person's own rating: 1 to 10, half stars out of five. Missing when they haven't rated it." }
        hasPoster: { type: boolean }
        posterTag: { type: string, description: "Set when an admin picked the cover; add it to the image URL as ?v= so a cached old cover isn't shown." }
        hasBackdrop: { type: boolean }
        showTitle: { type: string, description: "Episodes: the show's title." }
        seasonIndex: { type: integer, description: "Episodes: the season number." }
        artist: { type: string, description: "Albums and tracks: the artist's name." }
        artistId: { type: integer, description: "Albums and tracks: the artist's id." }
        album: { type: string, description: "Tracks: the album's title (its id is parentId)." }
        author: { type: string, description: "Books and their parts: the author's name. Podcasts and their episodes: who makes the show." }
        authorId: { type: integer, description: "Books and their parts: the author's id." }
        book: { type: string, description: "Book parts: the book's title (its id is parentId)." }
        narrators: { type: array, items: { type: string }, description: "Books: who reads them." }
        series: { type: string, description: "Books: the series the book is in." }
        seriesIndex: { type: number, description: "Books: its place in the series, such as 2 or 2.5." }
        podcast: { type: string, description: "Podcast episodes: the show's title (its id is parentId)." }
        released: { type: string, description: "Podcast episodes: the day it came out, as YYYY-MM-DD." }
        onWatchList: { type: boolean, description: "On the signed-in person's watch list." }
        genres: { type: array, items: { type: string }, description: "Movies and shows: genres from the online match.", examples: [[Science Fiction, Drama]] }
        mediaTags:
          type: array
          items: { type: string }
          description: >
            What the background analysis found, as short keys: resolution (8k, 4k, 1080p, 720p, 576p, 480p, sd);
            hdr plus one of dolby-vision, hdr10+, hdr10, hlg; the video codec (hevc, h264, av1…); atmos and dts-x;
            the most audio channels (7.1, 5.1, stereo, mono); for music lossless and hi-res; unreadable when the
            file couldn't be read. Shows and seasons get every tag of their episodes. Left out until analyzed.
          examples: [[4k, hdr, dolby-vision, hevc, atmos, "7.1"]]
        facts:
          type: array
          description: "Items of a plugin's kinds: labelled lines the plugin found, such as Manufacturer: Namco."
          items:
            type: object
            properties:
              label: { type: string }
              value: { type: string }
        pluginData: { type: object, description: "Items of a plugin's kinds: what the plugin keeps with the item for its player." }
    Plugin:
      type: object
      description: An installed plugin. The fields of its plugin.json (docs/plugins.md), plus its state here.
      required: [id, name, version, api, enabled, running, supported, config, hasIcon]
      properties:
        id: { type: string, examples: [arcade] }
        name: { type: string }
        version: { type: string }
        api: { type: integer, description: The plugin API version it was made for. }
        description: { type: string }
        author: { type: string }
        license: { type: string }
        homepage: { type: string }
        icon: { type: string, description: "Its path; fetch /plugins/{id}/files/{icon}." }
        server: { type: string }
        libraryKinds: { type: array, items: { type: object } }
        metadata: { type: array, items: { type: string } }
        events: { type: array, items: { type: string } }
        players: { type: array, items: { type: object } }
        settings:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              description: { type: string }
              secret: { type: boolean }
        permissions:
          type: object
          properties:
            network: { type: array, items: { type: string }, description: Hosts its server part may fetch from. }
        enabled: { type: boolean }
        running: { type: boolean }
        problem: { type: string, description: Why an enabled plugin isn't running. }
        supported: { type: boolean, description: This server runs the plugin's API version. }
        config: { type: object, additionalProperties: { type: string }, description: Its settings; secret ones show as ••••••. }
        hasIcon: { type: boolean }
    ItemDetail:
      allOf:
        - $ref: "#/components/schemas/Item"
        - type: object
          properties:
            mimeType: { type: string }
            subtitles: { type: array, items: { $ref: "#/components/schemas/SubtitleTrack" } }
            parents: { type: array, items: { $ref: "#/components/schemas/Item" }, description: Root first, such as show then season. }
            mediaInfo: { $ref: "#/components/schemas/MediaInfo" }
            mediaInfoStale: { type: boolean, description: The file changed since it was analyzed; a new analysis is on its way. }
            filePath: { type: string, description: Where the file is on the server. Admins only. }
            fileSize: { type: integer, description: Bytes. }
            details: { $ref: "#/components/schemas/Details" }
            credits: { $ref: "#/components/schemas/Credits" }
            feed:
              type: object
              description: Podcasts only.
              properties:
                feedUrl: { type: string }
                link: { type: string, description: The show's website. }
                refreshedAt: { type: integer, description: When the feed was last checked, in Unix seconds. }
                error: { type: string, description: Why the last check failed. Admins only. }
                following: { type: boolean }
                unplayed: { type: integer, description: Episodes the person hasn't played. }
            episode:
              type: object
              description: Podcast episodes only.
              properties:
                link: { type: string, description: The episode's web page. }
                episodeType: { type: string, enum: [full, trailer, bonus] }
    MediaInfo:
      type: object
      description: A file's streams in detail, from the background analysis. Left out until the file is analyzed.
      properties:
        container: { type: string, examples: [matroska, mov] }
        size: { type: integer }
        durationMs: { type: integer }
        bitrate: { type: integer, description: Bits per second, all streams. }
        chapters: { type: integer }
        creditsMs: { type: integer, description: Where the closing credits start, when a chapter is titled so. }
        error: { type: string, description: Set when the file couldn't be read. }
        analyzedAt: { type: integer, description: Unix seconds. }
        video:
          type: array
          items:
            type: object
            properties:
              index: { type: integer, description: Among the video streams. }
              codec: { type: string }
              profile: { type: string }
              width: { type: integer }
              height: { type: integer }
              resolution: { type: string, examples: [4K, 1080p, 720p] }
              frameRate: { type: number }
              bitrate: { type: integer }
              bitDepth: { type: integer }
              pixFmt: { type: string }
              colorPrimaries: { type: string }
              colorTransfer: { type: string }
              colorSpace: { type: string }
              hdr: { type: string, enum: [dolby-vision, hdr10+, hdr10, hlg], description: Left out for SDR. }
              hdrBase: { type: string, description: "Dolby Vision only: the HDR10, HDR10+ or HLG layer players without Dolby Vision show. Left out when there is none (profile 5)." }
              dvProfile: { type: integer }
              dvLevel: { type: integer }
              language: { type: string }
              title: { type: string }
              default: { type: boolean }
        audio:
          type: array
          items:
            type: object
            properties:
              index: { type: integer, description: Among the audio streams. }
              codec: { type: string, examples: [truehd, eac3, dts, aac, flac] }
              profile: { type: string }
              channels: { type: integer }
              channelLayout: { type: string }
              sampleRate: { type: integer }
              bitDepth: { type: integer }
              bitrate: { type: integer }
              atmos: { type: boolean }
              dtsx: { type: boolean }
              language: { type: string }
              title: { type: string }
              default: { type: boolean }
              forced: { type: boolean }
              commentary: { type: boolean }
              descriptive: { type: boolean, description: Audio description. }
        subtitles:
          type: array
          description: Embedded subtitle streams. Files next to the video are listed in ItemDetail.subtitles.
          items:
            type: object
            properties:
              index: { type: integer }
              codec: { type: string }
              language: { type: string }
              title: { type: string }
              default: { type: boolean }
              forced: { type: boolean }
              sdh: { type: boolean }
    AnalysisMode:
      type: string
      enum: [gentle, normal, off]
      description: >
        gentle (the default) reads a file every few seconds and waits while anyone is watching
        something transcoded; normal reads files back to back; off pauses. Both read one file at a
        time at the lowest CPU and disk priority.
    AnalysisStatus:
      type: object
      properties:
        mode: { $ref: "#/components/schemas/AnalysisMode" }
        state: { type: string, enum: [analyzing, waiting, slowDisk, idle, off], description: "waiting: for playback to end. slowDisk: files kept timing out, so it's resting." }
        total: { type: integer, description: Files in all libraries. }
        done: { type: integer, description: Files analyzed as they are now. }
        unreadable: { type: integer, description: Files among those done that couldn't be read. }
        current: { type: string, description: Title of the file being analyzed. }
    Details:
      type: object
      description: |
        The longer details of a movie, show, season or episode, once looked up
        online. Seasons and episodes carry their own air date plus their
        show's genres, certification and networks.
      properties:
        tagline: { type: string }
        originalTitle: { type: string, description: Only when it differs from the title. }
        originalLanguage: { type: string, description: "A language name, such as Japanese." }
        releaseDate: { type: string, description: "YYYY-MM-DD; first air date for shows." }
        endDate: { type: string, description: Last air date of a show that ended. }
        status: { type: string }
        certification: { type: string, description: "Age rating, such as PG-13 or TV-MA." }
        genres: { type: array, items: { type: string } }
        studios: { type: array, items: { type: string } }
        networks: { type: array, items: { type: string } }
        countries: { type: array, items: { type: string } }
        languages: { type: array, items: { type: string }, description: Spoken languages. }
        budget: { type: integer, description: US dollars. }
        revenue: { type: integer, description: "Worldwide box office, US dollars." }
        collection: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        seasons: { type: integer }
        episodes: { type: integer }
        imdbId: { type: string }
        wikidataId: { type: string }
        awards:
          type: array
          description: Wins first, then nominations, newest first. From Wikidata.
          items:
            type: object
            properties:
              name: { type: string }
              year: { type: integer }
              won: { type: boolean }
              names: { type: array, items: { type: string }, description: The people it went to, when not the title itself. }
        awardSummary: { type: string, description: "One line for the main pane, such as Won 4 Academy Awards · 31 wins and 62 nominations." }
    Credits:
      type: object
      description: |
        People in billing order. A season without its own cast has its show's;
        an episode's cast is its season's regulars, and its own guest stars
        and crew (director, writers) are listed separately.
      properties:
        cast: { type: array, items: { $ref: "#/components/schemas/Credit" } }
        guests: { type: array, items: { $ref: "#/components/schemas/Credit" } }
        crew: { type: array, items: { $ref: "#/components/schemas/Credit" }, description: Key jobs only, most important first. }
    Credit:
      type: object
      properties:
        personId: { type: integer }
        name: { type: string }
        role: { type: string, description: "The character, or a job such as Director." }
        department: { type: string }
        episodes: { type: integer, description: "For a show's cast: how many episodes they're in." }
        hasPhoto: { type: boolean, description: "See GET /people/{id}/image." }
    Person:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        hasPhoto: { type: boolean }
        biography: { type: string }
        birthday: { type: string }
        deathday: { type: string }
        birthplace: { type: string }
        knownFor: { type: string, description: "A department, such as Acting or Directing." }
        titles:
          type: array
          description: The movies and shows in the library they're in, newest first.
          items:
            type: object
            properties:
              item: { $ref: "#/components/schemas/Item" }
              roles: { type: array, items: { type: string }, description: "Characters and jobs, such as Director or Krazy-8 · 2 episodes." }
    SubtitleTrack:
      type: object
      properties:
        id: { type: string }
        label: { type: string, description: 'In English, such as "English (SDH)".' }
        note: { type: string, example: Commentary, description: The track's own title where it says more than its language and flags. }
        language: { type: string }
        codec: { type: string }
        forced: { type: boolean }
        default: { type: boolean }
        sdh: { type: boolean }
        external: { type: boolean }
        burnIn: { type: boolean, description: Picture-based; only playable burned into a transcode. }
    Download:
      type: object
      properties:
        id: { type: string }
        itemId: { type: integer }
        deviceId: { type: string, description: "The device's id, as in GET /devices." }
        quality: { type: string }
        subtitle: { type: string }
        state:
          type: string
          enum: [queued, preparing, ready, failed, expired]
          description: |
            `failed` downloads were tried three times; ask again to retry.
            `expired` means the device finished it and the server cleaned up its copy.
        progress: { type: integer, minimum: 0, maximum: 1000, description: Thousandths prepared. }
        error: { type: string, description: Why it failed, fit to show a person. }
        size: { type: integer, description: Bytes, once ready. }
        sha256: { type: string, description: Hex SHA-256 of the file, once ready. }
        md5: { type: string, description: "Hex MD5 of the file, once ready, for devices that can only hash files natively with MD5. It catches broken transfers, not tampering." }
        mimeType: { type: string }
        url: { type: string, example: /api/v1/downloads/abc123/file }
        createdAt: { type: integer }
        updatedAt: { type: integer }
        finishedAt: { type: integer, description: When the device said it has the whole file. }
    LiveItem:
      type: object
      properties:
        id: { type: integer }
        libraryId: { type: integer }
        kind: { type: string }
        title: { type: string }
        year: { type: integer }
        showTitle: { type: string }
        season: { type: integer }
        episode: { type: integer }
    ClientReport:
      type: object
      required: [name, platform, commands]
      properties:
        name: { type: string, examples: [Living room TV] }
        platform: { type: string, examples: [tvos] }
        app: { type: string, examples: [Matinee] }
        version: { type: string }
        commands: { type: array, items: { $ref: "#/components/schemas/CommandType" }, description: The commands this player takes; empty for none. }
        playing:
          type: [object, "null"]
          description: What's open in the player; null or absent for nothing.
          required: [itemId, positionMs, paused]
          properties:
            itemId: { type: integer }
            positionMs: { type: integer }
            durationMs: { type: integer, description: Defaults to the item's. }
            paused: { type: boolean }
            buffering: { type: boolean }
            volume: { type: number, minimum: 0, maximum: 1, description: Only for players with their own volume. }
            muted: { type: boolean }
            subtitles: { type: string, description: The subtitle track showing; empty for none. }
            transcoding: { type: boolean }
            sleepAt: { type: integer, description: When the sleep timer stops playback, in milliseconds; 0 for no timer. }
            sleepAtEnd: { type: boolean, description: The sleep timer stops at the end of this item. }
    CommandType:
      type: string
      enum: [play, pause, stop, seek, next, previous, playItem, volume, mute, sleep, subtitles]
    Command:
      type: object
      required: [type]
      properties:
        id: { type: string, readOnly: true }
        type: { $ref: "#/components/schemas/CommandType" }
        positionMs: { type: integer, description: "seek: where to; playItem: where to start (default: where the person left off)." }
        itemId: { type: integer, description: "playItem: what to play. A show or season plays its next episode." }
        item: { allOf: [{ $ref: "#/components/schemas/LiveItem" }], readOnly: true }
        volume: { type: number, minimum: 0, maximum: 1 }
        muted: { type: boolean }
        minutes: { type: integer, minimum: 0, maximum: 1440, description: "sleep: stop after this many minutes; 0 cancels the timer." }
        endOfItem: { type: boolean, description: "sleep: stop at the end of what's playing." }
        track: { type: string, description: "subtitles: the track to show; empty for none." }
        from: { type: string, readOnly: true, description: Who sent it, such as the name of the device that signed in. }
    Client:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        app: { type: string }
        version: { type: string }
        commands: { type: array, items: { $ref: "#/components/schemas/CommandType" } }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            guest: { type: boolean }
        online: { type: boolean }
        lastSeen: { type: integer }
        remote: { type: boolean, description: Away from home. }
        playing:
          type: object
          description: Absent when nothing plays. positionMs was true at updatedAt and moves on unless paused.
          properties:
            item: { $ref: "#/components/schemas/LiveItem" }
            positionMs: { type: integer }
            durationMs: { type: integer }
            paused: { type: boolean }
            buffering: { type: boolean }
            volume: { type: number }
            muted: { type: boolean }
            subtitles: { type: string }
            transcoding: { type: boolean }
            sleepAt: { type: integer }
            sleepAtEnd: { type: boolean }
            updatedAt: { type: integer }
    Event:
      type: object
      properties:
        type: { type: string, examples: [playback.started] }
        time: { type: integer, description: Milliseconds. }
        client: { allOf: [{ $ref: "#/components/schemas/Client" }], description: "client.updated, and playback events: the client playing." }
        clients: { type: array, items: { $ref: "#/components/schemas/Client" }, description: snapshot only. }
        clientId: { type: string, description: client.removed only. }
        item: { $ref: "#/components/schemas/LiveItem" }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            guest: { type: boolean }
        library:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            kind: { type: string }
        positionMs: { type: integer }
        finished: { type: boolean, description: "playback.stopped: it got to the end." }
