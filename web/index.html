<!doctype html>
<html lang="en" class="bg-ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#100d12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Matinee</title>
    <script>
      // Wear the last theme before the first paint (src/theme.ts keeps it).
      try {
        const t = JSON.parse(localStorage.getItem('matinee-theme'))
        if (t && t.css) {
          document.documentElement.style.cssText = t.css
          document.documentElement.dataset.theme = t.id
          document.querySelector('meta[name="theme-color"]').setAttribute('content', t.ink)
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
