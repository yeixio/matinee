# Single machine: SQLite in ./data, nothing else to run.
#   docker compose up -d
# With PostgreSQL instead: docker compose --profile postgres up -d
# and uncomment MATINEE_DATABASE_URL below.
services:
  matinee:
    image: ghcr.io/yeixio/matinee:latest
    build: .
    ports:
      - "7171:7171"
    # For the apps to find this server on your network by themselves, and
    # for remote access (Settings → Remote access) to open a port on your
    # router, use the host's network instead of the ports above (Linux only):
    # network_mode: host
    environment:
      MATINEE_SCAN_INTERVAL: 15m
      # MATINEE_TMDB_KEY: your-themoviedb-key
      # MATINEE_DATABASE_URL: postgres://matinee:matinee@postgres:5432/matinee?sslmode=disable
    volumes:
      - ./data:/data
      - /path/to/movies:/media/movies:ro
      - /path/to/tv:/media/tv:ro
      - /path/to/music:/media/music:ro
    restart: unless-stopped
    # Hardware transcoding. AMD or Intel GPU (VAAPI): pass the GPU in, and
    # add the group that owns it on the host (`getent group render` prints
    # its number, often 104 to 110 or 992 to 993).
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "993"
    # NVIDIA GPU (needs the NVIDIA Container Toolkit on the host):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu, video]
    # Settings → Transcoding shows which one Matinee found.

  postgres:
    profiles: [postgres]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: matinee
      POSTGRES_PASSWORD: matinee
      POSTGRES_DB: matinee
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
